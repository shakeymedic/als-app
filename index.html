                                <button data-action="copy-record" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg">Copy Record</button>
                                <button data-action="print-record" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-lg">Print Record</button>
                            </div>
                            <p class="text-xs text-slate-500 mt-8">Use <strong>New Patient</strong> (top right) to clear this record from the device.</p>
                            <button data-action="undo-end" class="mt-3 text-xs text-slate-400 hover:text-slate-600 underline">Ended by mistake? Resume this record</button>
                        </div>`;
                    break;
            }
            guidanceContent.innerHTML = content;
            refreshIcons();
        };

        const renderLog = () => {
            if (!state.log.length) {
                logContent.innerHTML = '<p class="text-slate-400 italic p-2">No events yet.</p>';
                return;
            }
            logContent.innerHTML = state.log.map(e => `
                <div class="py-2 px-1 border-b border-slate-100 flex justify-between gap-3 text-sm">
                    <span class="font-semibold min-w-0 break-words ${e.voided ? 'line-through text-slate-400' : 'text-slate-700'}">${esc(e.message)}${e.voided ? ' <span class="no-underline text-xs text-red-500">(entered in error)</span>' : ''}</span>
                    <span class="text-slate-400 text-xs whitespace-nowrap font-mono">${tPlus(e.t)} · ${formatClock(e.t)}</span>
                </div>`).join('');
            if (!logContent.classList.contains('hidden')) contentArea.scrollTop = contentArea.scrollHeight;
        };

        const updateUI = () => {
            const isPostRosc = state.currentStep === 'POST_ROSC';
            const inArrest = state.isArrestActive && state.outcome === 'ONGOING';

            $('rosc-label').textContent = state.mode === 'NEO' ? 'Stable (HR > 100)' : 'ROSC Achieved';
            $('manual-check-label').textContent = state.mode === 'NEO' ? 'Reassess HR Now' : 'Manual Rhythm Check';
            roscBtn.classList.toggle('hidden', !inArrest);
            rearrestBtn.classList.toggle('hidden', !(isPostRosc && state.isArrestActive));
            manualCheckBtn.classList.toggle('hidden', !state.isCprInProgress);
            cycleResetBtn.classList.toggle('hidden', !state.isCprInProgress);
            viewSummaryBtn.classList.toggle('hidden', !state.startTime);
            leftPanelCombinedContainer.classList.toggle('hidden', !state.startTime);
            interventionsBlock.classList.toggle('hidden', !state.isArrestActive);

            if (state.isArrestActive) {
                endArrestBtn.classList.remove('bg-slate-400', 'text-slate-700', 'cursor-not-allowed');
                endArrestBtn.classList.add('bg-red-600', 'hover:bg-red-700', 'text-white');
                endArrestBtn.disabled = false;
            } else {
                endArrestBtn.classList.add('bg-slate-400', 'text-slate-700', 'cursor-not-allowed');
                endArrestBtn.classList.remove('bg-red-600', 'hover:bg-red-700', 'text-white');
                endArrestBtn.disabled = true;
            }
            if (!state.isCprInProgress) document.body.classList.remove('flash-active');

            updatePatientInfoDisplay();
            renderGuidance();
            renderInterventionButtons();
            renderLog();
            tick();
            save();
        };

        // ---------------------------------------------------------------------------
        // Timers — derived from wall-clock timestamps so they cannot drift when the
        // screen locks or the tab is in the background
        // ---------------------------------------------------------------------------
        let lastBeepSecond = null;
        const tick = () => {
            const now = Date.now();
            totalElapsedTimeElem.textContent = formatTime(arrestSeconds(now));
            totalLabel.textContent = state.rearrestTimes.length ? `Arrest Time (${state.rearrestTimes.length + 1} episodes)` : 'Arrest Time';

            const large = $('cpr-cycle-timer-large');
            if (state.isCprInProgress && state.cycleEndsAt) {
                const rem = Math.max(0, Math.ceil((state.cycleEndsAt - now) / 1000));
                cycleLabel.textContent = state.mode === 'NEO' ? 'Next HR Check' : 'Next Rhythm Check';
                cprCycleTimerSmall.textContent = formatTime(rem);
                if (large) large.textContent = formatTime(rem);
                if (rem <= 5 && rem > 0) {
                    document.body.classList.add('flash-active');
                    if (lastBeepSecond !== rem) { lastBeepSecond = rem; audio.beep(880, 0.08); }
                } else {
                    document.body.classList.remove('flash-active');
                }
                if (now >= state.cycleEndsAt) { cycleFinished(); return; }
            } else if (state.currentStep === 'POST_ROSC' && state.roscTimes.length) {
                cycleLabel.textContent = state.mode === 'NEO' ? 'Since Stable' : 'Since ROSC';
                cprCycleTimerSmall.textContent = formatTime((now - state.roscTimes[state.roscTimes.length - 1]) / 1000);
            } else {
                cycleLabel.textContent = state.mode === 'NEO' ? 'Next HR Check' : 'Next Rhythm Check';
                cprCycleTimerSmall.textContent = (state.currentStep === 'ASSESS_RHYTHM' && state.isArrestActive) ? 'NOW' : '--:--';
            }

            // Sub-line: adrenaline status (and nothing else, to keep the timer uncluttered)
            const adr = adrenalineStatus(now);
            let sub = '';
            if (state.startTime && adr.count > 0) {
                sub = `Adrenaline ×${adr.count}` + (adr.since !== null ? ` · last ${formatTime(adr.since)} ago` : ' (pre-arrival)');
                if (adr.due) sub += ' · DUE';
            } else if (adr.due) {
                sub = 'Adrenaline DUE';
            }
            timerSubline.textContent = sub;
            timerSubline.classList.toggle('hidden', !sub);
            timerSubline.classList.toggle('text-purple-700', adr.due);
            timerSubline.classList.toggle('text-slate-500', !adr.due);

            if (state.currentStep === 'PERFORMING_CPR') {
                const html = buildConsiderations(now);
                if (html !== lastConsiderations) {
                    const el = $('considerations');
                    if (el) el.innerHTML = html;
                    lastConsiderations = html;
                }
            }
        };

        const setCycle = () => {
            state.cycleEndsAt = Date.now() + cycleDuration() * 1000;
            lastBeepSecond = null;
        };

        const cycleFinished = () => {
            state.isCprInProgress = false;
            state.cycleEndsAt = null;
            state.currentStep = 'ASSESS_RHYTHM';
            document.body.classList.remove('flash-active');
            addLog(state.mode === 'NEO' ? '30 s elapsed – reassess heart rate' : 'Cycle complete – rhythm check due');
            audio.endTones();
            setMainActiveTab(guidanceTab);
            updateUI();
        };

        // ---------------------------------------------------------------------------
        // Event handlers — arrest flow
        // ---------------------------------------------------------------------------
        const weightLog = () => {
            if (state.patientWeight) addLog(`Weight: ${state.patientWeight} kg (${state.weightSource || 'entered'})`);
        };

        const beginEpisode = () => {
            const keep = { patientWeight: state.patientWeight, patientAge: state.patientAge, weightSource: state.weightSource, wetflag: state.wetflag };
            const mode = state.mode;
            state = { ...newState(mode), ...keep };
            pendingRestore = null;
            state.isArrestActive = true;
            state.outcome = 'ONGOING';
            state.startTime = Date.now();
            state.notes = handoverNotes.value = '';
            audio.ensure();
            requestWakeLock();
            populateReversible();
            renderSpecialCircs();
        };

        const handleStartArrest = () => {
            beginEpisode();
            addLog(`${MODE_LABEL[state.mode]}: resuscitation started`);
            if (state.mode === 'NEO') {
                if (!state.patientWeight) { state.patientWeight = 3.5; state.weightSource = 'assumed – not entered'; }
                weightLog();
                state.currentStep = 'NEO_AIRWAY';
            } else {
                weightLog();
                state.currentStep = 'ASSESS_RHYTHM';
            }
            setMainActiveTab(guidanceTab);
            updateUI();
        };

        const handleContinueFromPreArrest = () => {
            const num = id => Math.max(0, Math.min(50, parseInt($(id).value, 10) || 0));
            const cycles = num('pre-cycles'), shocks = num('pre-shocks'), adrenaline = num('pre-adrenaline'), amiodarone = num('pre-amiodarone');
            beginEpisode();
            addLog(`${MODE_LABEL[state.mode]}: patient arrived in arrest`);
            weightLog();
            if (cycles) addLog(`[PRE-ARRIVAL] ${cycles} cycles completed`);
            if (shocks) addLog(`[PRE-ARRIVAL] ${shocks} shocks delivered`);
            if (adrenaline) addLog(`[PRE-ARRIVAL] ${adrenaline} adrenaline dose(s)`);
            if (amiodarone) addLog(`[PRE-ARRIVAL] ${amiodarone} amiodarone dose(s)`);
            state.counts.adrenaline = adrenaline;
            state.counts.amiodarone = amiodarone;
            state.cycleCount = cycles;
            state.shocksDelivered = shocks;
            state.counts.shocks = shocks;
            state.currentStep = 'ASSESS_RHYTHM';
            updateUI();
        };

        const handleRhythmChoice = (code) => {
            const r = RHYTHMS[code];
            if (!r || state.currentStep !== 'ASSESS_RHYTHM') return;
            state.currentRhythm = r.shockable ? 'SHOCKABLE' : 'NON_SHOCKABLE';
            addLog(`Rhythm: ${r.label} (${r.shockable ? 'shockable' : 'non-shockable'})`, { type: 'rhythm', rhythm: r.label });
            if (r.shockable) {
                state.currentStep = 'SHOCKABLE';
                updateUI();
            } else {
                handleStartCpr();
            }
        };

        const handleDeliverShock = () => {
            if (state.currentStep !== 'SHOCKABLE') return;
            state.shocksDelivered++;
            state.counts.shocks++;
            let energy = '';
            if (state.mode === 'ADULT' && state.shockEnergy) energy = ` (${state.shockEnergy} J)`;
            else if (state.mode === 'PAEDS') energy = state.wetflag ? ` (${state.wetflag.energyText})` : ' (4 J/kg)';
            addLog(`Shock ${state.shocksDelivered} delivered${energy}`, { type: 'shock' });
            handleStartCpr();
        };

        const handleStartCpr = (neoPhase = null) => {
            state.isCprInProgress = true;
            state.cycleCount++;
            state.currentStep = 'PERFORMING_CPR';
            state.neoPhase = neoPhase;
            setCycle();
            if (state.mode === 'NEO') {
                if (neoPhase === 'CPR') state.neoCprCycles++;
                addLog(neoPhase === 'CPR' ? `Chest compressions 3:1 (30 s cycle ${state.cycleCount})` : `Ventilation breaths (30 s cycle ${state.cycleCount})`);
            } else {
                addLog(`CPR cycle ${state.cycleCount} started`);
            }
            updateUI();
        };

        const handleRosc = () => {
            if (!state.isArrestActive || state.outcome !== 'ONGOING') return;
            state.roscTimes.push(Date.now());
            state.outcome = 'ROSC';
            state.isCprInProgress = false;
            state.cycleEndsAt = null;
            state.currentStep = 'POST_ROSC';
            stopMetronome();
            addLog(state.mode === 'NEO' ? 'HR > 100 & breathing – stabilised' : 'ROSC achieved', { type: 'rosc' });
            setMainActiveTab(guidanceTab);
            updateUI();
        };

        const handleRearrest = () => {
            if (!state.isArrestActive || state.currentStep !== 'POST_ROSC') return;
            state.rearrestTimes.push(Date.now());
            state.outcome = 'ONGOING';
            state.currentStep = 'ASSESS_RHYTHM';
            addLog(`Re-arrest (episode ${state.rearrestTimes.length + 1})`, { type: 'rearrest' });
            setMainActiveTab(guidanceTab);
            updateUI();
        };

        const handleEndArrest = async () => {
            if (!state.isArrestActive) return;
            const inRosc = state.outcome === 'ROSC';
            const choice = await showDialog({
                title: 'End this resuscitation episode?',
                message: inRosc ? 'The patient currently has ROSC. Choose the outcome to record.' : 'Resuscitation is in progress. Choose the outcome to record.',
                buttons: inRosc ? [
                    { label: 'ROSC – care handed over', value: 'ROSC', cls: 'bg-green-600 hover:bg-green-700 text-white' },
                    { label: 'Patient died', value: 'DIED', cls: 'bg-slate-700 hover:bg-slate-800 text-white' },
                    { label: 'Cancel – continue', value: null }
                ] : [
                    { label: 'Resuscitation stopped', value: 'STOPPED', cls: 'bg-slate-700 hover:bg-slate-800 text-white' },
                    { label: 'Handed over – CPR ongoing', value: 'HANDOVER', cls: 'bg-blue-600 hover:bg-blue-700 text-white' },
                    { label: 'Cancel – continue', value: null }
                ]
            });
            if (!choice || !state.isArrestActive) return;
            state.prevOutcome = state.outcome;
            state.outcome = choice;
            state.endTime = Date.now();
            state.isArrestActive = false;
            state.isCprInProgress = false;
            state.cycleEndsAt = null;
            state.currentStep = 'ENDED';
            stopMetronome();
            releaseWakeLock();
            const msg = {
                STOPPED: `Resuscitation stopped at ${formatClock(state.endTime)}`,
                HANDOVER: 'Care handed over with CPR ongoing',
                ROSC: 'Episode ended – ROSC, care handed over',
                DIED: `Patient died after ROSC – episode ended at ${formatClock(state.endTime)}`
            }[choice];
            addLog(msg, { type: 'end' });
            setMainActiveTab(guidanceTab);
            updateUI();
            openSummaryModal();
        };

        const undoEnd = () => {
            if (state.currentStep !== 'ENDED') return;
            state.outcome = state.prevOutcome || 'ONGOING';
            state.endTime = null;
            state.isArrestActive = true;
            state.currentStep = state.outcome === 'ROSC' ? 'POST_ROSC' : 'ASSESS_RHYTHM';
            addLog('End of episode undone – record resumed');
            requestWakeLock();
            updateUI();
        };

        const handleManualCheck = () => {
            if (!state.isCprInProgress) return;
            state.isCprInProgress = false;
            state.cycleEndsAt = null;
            state.currentStep = 'ASSESS_RHYTHM';
            addLog(state.mode === 'NEO' ? 'Early heart rate check' : 'Manual rhythm check (compressions paused)');
            setMainActiveTab(guidanceTab);
            updateUI();
        };

        window.resetCycleTimer = () => {
            if (!state.isCprInProgress) return;
            setCycle();
            addLog('Cycle timer restarted');
            tick();
        };

        // ---------------------------------------------------------------------------
        // Weight entry
        // ---------------------------------------------------------------------------
        window.updatePaedsCalc = (val, type) => {
            if (type === 'age') {
                const a = parseFloat(val);
                if (isNaN(a) || a < 0 || a > 18) { showToast('Enter an age between 0 and 18 years'); return; }
                state.patientAge = a;
                state.patientWeight = +estimateWeightFromAge(a).toFixed(1);
                state.weightSource = 'estimated from age';
                const wIn = $('input-weight');
                if (wIn) wIn.value = state.patientWeight;
            } else {
                const w = parseFloat(val);
                if (isNaN(w) || w <= 0 || w > 150) { showToast('Enter a weight between 0.5 and 150 kg'); return; }
                state.patientWeight = +w.toFixed(1);
                state.weightSource = 'entered';
            }
            state.wetflag = paedsDoses(state.patientWeight, state.patientAge);
            if (state.startTime) weightLog();
            const res = $('wetflag-results');
            if (res) res.outerHTML = wetflagResultsHtml();
            renderInterventionButtons();
            updatePatientInfoDisplay();
            save();
        };

        window.updateNeoWeight = (val) => {
            const w = parseFloat(val);
            if (val === '' || isNaN(w)) { state.patientWeight = 0; state.weightSource = null; }
            else if (w < 0.3 || w > 7) { showToast('Enter a neonatal weight between 0.3 and 7 kg'); return; }
            else { state.patientWeight = +w.toFixed(2); state.weightSource = 'entered'; }
            const res = $('neo-results');
            if (res) res.outerHTML = neoResultsHtml();
        };

        // ---------------------------------------------------------------------------
        // Record (summary modal, copy, print)
        // ---------------------------------------------------------------------------
        const DETAIL_FIELDS = [
            ['location', 'Location', 'text'],
            ['teamLeader', 'Team leader', 'text'],
            ['collapseTime', 'Time of collapse', 'time'],
            ['call2222', '2222 call time', 'time'],
            ['witnessed', 'Witnessed', 'select']
        ];
        const WITNESSED_OPTIONS = ['', 'Witnessed', 'Unwitnessed', 'Not known'];
        const detailsFilled = () => Object.values(state.details || {}).some(v => v && String(v).trim());
        const recordEntries = () => state.log.filter(e => ['drug', 'shock', 'airway', 'intervention'].includes(e.type));
        const initialRhythm = () => (state.log.find(e => e.type === 'rhythm') || {}).rhythm || '';

        const timeline = () => {
            const items = [{ label: 'Started', t: state.startTime }];
            state.roscTimes.forEach((t, i) => items.push({ label: state.mode === 'NEO' ? `Stable${i ? ` (${i + 1})` : ''}` : `ROSC${i ? ` (${i + 1})` : ''}`, t }));
            state.rearrestTimes.forEach((t, i) => items.push({ label: `Re-arrest${state.rearrestTimes.length > 1 ? ` (${i + 1})` : ''}`, t }));
            if (state.endTime) items.push({ label: { STOPPED: 'Resuscitation stopped', HANDOVER: 'Handed over (CPR ongoing)', ROSC: 'Handed over (ROSC)', DIED: 'Died' }[state.outcome] || 'Ended', t: state.endTime });
            return items.sort((a, b) => a.t - b.t);
        };

        const renderSummary = () => {
            const now = Date.now();
            const cell = (label, value) => `<div class="bg-slate-50 p-2 rounded border border-slate-200"><p class="text-xs text-slate-500">${label}</p><p class="font-bold text-slate-800">${esc(value)}</p></div>`;
            const section = (title, inner) => `<div class="border-t border-slate-200 pt-3"><h3 class="font-bold text-slate-700 mb-2">${title}</h3>${inner}</div>`;
            const row = e => `<tr class="${e.voided ? 'line-through text-slate-400' : ''}"><td class="pr-3 font-mono whitespace-nowrap align-top">${formatClock(e.t)}</td><td class="pr-3 font-mono whitespace-nowrap align-top text-slate-500">${tPlus(e.t)}</td><td>${esc(e.message ?? e.label)}${e.voided ? ' <span class="text-red-500 text-xs">(entered in error)</span>' : ''}</td></tr>`;

            const totals = [['Adrenaline', 'adrenaline'], ['Amiodarone', 'amiodarone'], ['Fluid', 'fluids'], ['Glucose', 'glucose'], ['IV/IO access', 'access'], ['SGA', 'sga'], ['ETT', 'ett']]
                .filter(([, k]) => state.counts[k] > 0).map(([l, k]) => `${l} ×${state.counts[k]}`).join(' · ');

            const fields = DETAIL_FIELDS.map(([key, label, type]) => {
                const v = state.details[key] || '';
                const input = type === 'select'
                    ? `<select data-detail="${key}" class="w-full p-1.5 border border-slate-300 rounded text-sm">${WITNESSED_OPTIONS.map(o => `<option value="${o}" ${o === v ? 'selected' : ''}>${o || '—'}</option>`).join('')}</select>`
                    : `<input data-detail="${key}" type="${type}" value="${esc(v)}" class="w-full p-1.5 border border-slate-300 rounded text-sm">`;
                return `<label class="text-xs text-slate-500 block">${label}${input}</label>`;
            }).join('');

            const causesTreated = Object.keys(state.reversiblesTreated);
            const causesLikely = Object.keys(state.reversiblesLikely);
            const circs = specialCircumstances.filter(sc => state.specialCircs[sc.id]).map(sc => sc.name);
            const info = state.mode === 'PAEDS' ? paedsInfoLines() : (state.mode === 'NEO' ? neoInfoLines() : []);
            const entries = recordEntries();

            summaryContent.innerHTML = `
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-50 p-3 rounded border border-slate-200">
                        <p class="text-xs text-slate-500 uppercase font-bold">Outcome</p>
                        <p class="text-lg font-bold ${outcomeColour()}">${esc(outcomeLabel())}</p>
                    </div>
                    <div class="bg-slate-50 p-3 rounded border border-slate-200">
                        <p class="text-xs text-slate-500 uppercase font-bold">Time in Arrest</p>
                        <p class="text-lg font-mono font-bold text-slate-800">${formatTime(arrestSeconds(now))}</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-sm">
                    ${cell('Date', formatDate(state.startTime))}
                    ${cell('Protocol', MODE_LABEL[state.mode])}
                    ${cell(state.mode === 'NEO' ? 'First HR assessment' : 'Initial rhythm', initialRhythm() || '—')}
                    ${cell('Cycles / Shocks', `${state.cycleCount} / ${state.counts.shocks}`)}
                </div>
                ${section('Timeline', `<table class="w-full text-sm">${timeline().map(row).join('')}</table>`)}
                <details class="record-details border-t border-slate-200 pt-3" ${detailsFilled() ? 'open' : ''}>
                    <summary class="font-bold text-slate-700 cursor-pointer">Record details <span class="font-normal text-slate-400 text-xs">(optional – complete after the event)</span></summary>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">${fields}</div>
                </details>
                ${entries.length ? section('Drugs, Shocks &amp; Interventions', `<table class="w-full text-sm">${entries.map(row).join('')}</table>${totals ? `<p class="text-xs text-slate-500 mt-2">Totals: ${totals}</p>` : ''}`) : ''}
                ${info.length ? section(state.mode === 'NEO' ? 'Patient Info (Neonatal)' : 'Patient Info (Paediatric – WETFLAG)', `<div class="text-sm text-slate-600 space-y-1">${info.map(l => `<div>${esc(l)}</div>`).join('')}</div>`) : ''}
                ${causesTreated.length || causesLikely.length ? section('Reversible Causes', `<div class="text-sm text-slate-600 space-y-1">${causesLikely.length ? `<div><strong>Likely:</strong> ${esc(causesLikely.join(', '))}</div>` : ''}${causesTreated.length ? `<div><strong>Treated:</strong> ${esc(causesTreated.join(', '))}</div>` : ''}</div>`) : ''}
                ${circs.length ? section('Special Circumstances', `<div class="text-sm text-slate-600">${esc(circs.join(', '))}</div>`) : ''}
                ${state.notes.trim() ? section('Handover / Notes', `<div class="text-sm text-slate-600 whitespace-pre-wrap">${esc(state.notes.trim())}</div>`) : ''}
                ${section('Full Event Log', `<div class="summary-log bg-slate-50 p-2 rounded border border-slate-200 max-h-64 overflow-y-auto"><table class="w-full text-xs">${state.log.map(row).join('')}</table></div>`)}
            `;
        };

        window.openSummaryModal = () => {
            renderSummary();
            summaryModal.classList.remove('hidden');
            refreshIcons();
        };
        window.closeSummary = () => summaryModal.classList.add('hidden');

        const buildRecordText = () => {
            const L = [];
            const line = (e) => `${formatClock(e.t)}  ${tPlus(e.t).padEnd(9)}  ${e.voided ? '[ENTERED IN ERROR] ' : ''}${e.message ?? e.label}`;
            L.push('RESUSCITATION RECORD');
            L.push(`Date: ${formatDate(state.startTime)}`);
            L.push(`Protocol: ${MODE_LABEL[state.mode]}`);
            L.push(`Outcome: ${outcomeLabel()}`);
            L.push(`Time in arrest: ${formatTime(arrestSeconds())}`);
            L.push(`${state.mode === 'NEO' ? 'First HR assessment' : 'Initial rhythm'}: ${initialRhythm() || 'not recorded'}`);
            L.push(`Cycles: ${state.cycleCount} | Shocks: ${state.counts.shocks}`);
            L.push('', 'TIMELINE');
            timeline().forEach(i => L.push(line(i)));
            if (detailsFilled()) {
                L.push('', 'RECORD DETAILS');
                DETAIL_FIELDS.forEach(([k, label]) => { if (state.details[k]) L.push(`${label}: ${state.details[k]}`); });
            }
            const entries = recordEntries();
            if (entries.length) {
                L.push('', 'DRUGS, SHOCKS & INTERVENTIONS');
                entries.forEach(e => L.push(line(e)));
            }
            const info = state.mode === 'PAEDS' ? paedsInfoLines() : (state.mode === 'NEO' ? neoInfoLines() : []);
            if (info.length) { L.push('', 'PATIENT INFO'); info.forEach(l => L.push(l)); }
            const treated = Object.keys(state.reversiblesTreated), likely = Object.keys(state.reversiblesLikely);
            if (treated.length || likely.length) {
                L.push('', 'REVERSIBLE CAUSES');
                if (likely.length) L.push(`Likely: ${likely.join(', ')}`);
                if (treated.length) L.push(`Treated: ${treated.join(', ')}`);
            }
            const circs = specialCircumstances.filter(sc => state.specialCircs[sc.id]).map(sc => sc.name);
            if (circs.length) L.push('', `SPECIAL CIRCUMSTANCES: ${circs.join(', ')}`);
            if (state.notes.trim()) L.push('', 'HANDOVER / NOTES', state.notes.trim());
            L.push('', 'FULL EVENT LOG');
            state.log.forEach(e => L.push(line(e)));
            return L.join('\n');
        };

        window.copyFullRecord = (btn) => {
            if (!state.startTime) { showToast('Nothing recorded yet'); return; }
            copyText(buildRecordText(), btn);
        };

        window.printRecord = () => {
            if (!state.startTime) { showToast('Nothing recorded yet'); return; }
            renderSummary();
            window.print();
        };
        window.addEventListener('beforeprint', () => { if (state.startTime) renderSummary(); });

        summaryContent.addEventListener('input', (e) => {
            const key = e.target.dataset && e.target.dataset.detail;
            if (!key) return;
            state.details[key] = e.target.value;
            save();
        });
        summaryContent.addEventListener('change', (e) => {
            const key = e.target.dataset && e.target.dataset.detail;
            if (!key) return;
            state.details[key] = e.target.value;
            save();
        });

        // ---------------------------------------------------------------------------
        // Session restore / reset
        // ---------------------------------------------------------------------------
        const restoreSaved = (auto = false) => {
            const s = pendingRestore;
            if (!s) return;
            const { savedAt, ...rest } = s;
            state = { ...newState(s.mode), ...rest, counts: { ...blankCounts(), ...s.counts }, details: { ...blankDetails(), ...(s.details || {}) } };
            pendingRestore = null;
            handoverNotes.value = state.notes || '';
            applyProtocolStyling();
            populateReversible();
            renderSpecialCircs();
            if (state.isArrestActive) {
                addLog(auto ? 'Record restored after page reload' : 'Record reopened');
                requestWakeLock();
            }
            updateUI();
            if (auto) showToast('Resuscitation record restored after reload');
        };

        const resetApp = () => {
            stopMetronome();
            releaseWakeLock();
            document.body.classList.remove('flash-active');
            state = newState(state.mode);
            pendingRestore = null;
            try { _storage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
            handoverNotes.value = '';
            customInterventionInput.value = '';
            populateReversible();
            renderSpecialCircs();
            closeSummary();
            setMainActiveTab(guidanceTab);
            applyProtocolStyling();
            updateUI();
        };

        $('reset-app-btn').addEventListener('click', async () => {
            if (!state.startTime) { resetApp(); return; }
            const ok = await showDialog({
                title: 'Start a new patient?',
                message: state.isArrestActive
                    ? 'An episode is still in progress. This will clear the current record from this device.'
                    : 'This clears the current record from this device. Make sure it has been copied or printed.',
                buttons: [
                    { label: 'Clear record & start new', value: true, cls: 'bg-red-600 hover:bg-red-700 text-white' },
                    { label: 'Cancel', value: false }
                ]
            });
            if (ok) resetApp();
        });

        // ---------------------------------------------------------------------------
        // Event listeners
        // ---------------------------------------------------------------------------
        guidanceContent.addEventListener('click', (e) => {
            const b = e.target.closest('button');
            if (!b || !b.dataset.action) return;
            switch (b.dataset.action) {
                case 'protocol': setProtocol(b.dataset.mode); break;
                case 'calc-age': updatePaedsCalc($('input-age').value, 'age'); break;
                case 'start': handleStartArrest(); break;
                case 'pre-arrived': state.currentStep = 'PRE_ARREST_INFO'; updateUI(); break;
                case 'pre-back': state.currentStep = 'START'; updateUI(); break;
                case 'pre-continue': handleContinueFromPreArrest(); break;
                case 'rhythm': handleRhythmChoice(b.dataset.rhythm); break;
                case 'energy': {
                    const j = parseInt(b.dataset.energy, 10);
                    state.shockEnergy = state.shockEnergy === j ? null : j;
                    renderGuidance(); save();
                    break;
                }
                case 'shock': handleDeliverShock(); break;
                case 'shock-back': state.currentStep = 'ASSESS_RHYTHM'; addLog('Shock not delivered – back to rhythm check'); updateUI(); break;
                case 'neo-inflation':
                    addLog(state.neoChestNotMoving ? 'Inflation breaths repeated' : '5 inflation breaths given');
                    state.neoChestNotMoving = false;
                    state.currentStep = 'ASSESS_RHYTHM';
                    updateUI();
                    break;
                case 'neo-chest':
                    addLog('Chest not moving – airway manoeuvres');
                    state.neoChestNotMoving = true;
                    state.currentStep = 'NEO_AIRWAY';
                    updateUI();
                    break;
                case 'neo-vent':
                    addLog('HR ≥ 60 – ventilate', { type: 'rhythm', rhythm: 'HR ≥ 60' });
                    handleStartCpr('VENT');
                    break;
                case 'neo-cpr':
                    addLog('HR < 60 – chest compressions, 100% oxygen', { type: 'rhythm', rhythm: 'HR < 60' });
                    handleStartCpr('CPR');
                    break;
                case 'rosc': handleRosc(); break;
                case 'view-summary': openSummaryModal(); break;
                case 'copy-record': copyFullRecord(b); break;
                case 'print-record': printRecord(); break;
                case 'undo-end': undoEnd(); break;
                case 'resume-saved': restoreSaved(false); break;
                case 'discard-saved':
                    pendingRestore = null;
                    try { _storage.removeItem(STORAGE_KEY); } catch (err) { /* ignore */ }
                    renderGuidance();
                    break;
            }
        });

        guidanceContent.addEventListener('change', (e) => {
            if (e.target.id === 'input-weight') updatePaedsCalc(e.target.value, 'weight');
            if (e.target.id === 'input-neo-weight') updateNeoWeight(e.target.value);
        });

        manualCheckBtn.addEventListener('click', handleManualCheck);
        roscBtn.addEventListener('click', handleRosc);
        rearrestBtn.addEventListener('click', handleRearrest);
        endArrestBtn.addEventListener('click', handleEndArrest);

        interventionsButtonsGrid.addEventListener('click', (e) => {
            if (!state.isArrestActive) return;

            // Weight entry fallback (paeds, no weight yet)
            if (e.target.closest('#paeds-weight-set')) {
                updatePaedsCalc($('paeds-drug-weight').value, 'weight');
                return;
            }

            // Undo: marks the most recent matching entry as "entered in error" (never deleted)
            if (e.target.classList.contains('decrement-btn')) {
                e.stopPropagation();
                const button = e.target.closest('button');
                if (!button) return;
                const key = button.dataset.drug || (button.dataset.intervention === 'access' ? 'access' : null);
                if (key && state.counts[key] > 0) {
                    state.counts[key]--;
                    const voided = voidLast(key);
                    addLog(`Correction: ${voided ? voided.message : key} – entered in error`, { type: 'correction' });
                    renderInterventionButtons();
                    tick();
                }
                return;
            }

            const button = e.target.closest('button');
            if (!button || button.disabled) return;

            if (button.dataset.drug) {
                const drug = button.dataset.drug;
                const drugName = button.dataset.drugName || drug;
                if (drug === 'adrenaline') {
                    const prev = lastAdrenalineTime();
                    const interval = state.specialCircs['hypothermia-moderate'] ? 360 : 180;
                    state.counts.adrenaline++;
                    addLog(`${drugName} given`, { type: 'drug', key: drug });
                    if (prev) {
                        const gap = Math.floor((Date.now() - prev) / 1000);
                        if (gap < interval) {
                            addLog(`⚠ Adrenaline given ${formatTime(gap)} after previous dose (recommended interval ${interval === 360 ? '6–10' : '3–5'} min)`);
                            renderInterventionButtons();
                            const fresh = interventionsButtonsGrid.querySelector('button[data-drug="adrenaline"]');
                            if (fresh) {
                                fresh.classList.add('ring-4', 'ring-amber-400');
                                setTimeout(() => fresh.classList.remove('ring-4', 'ring-amber-400'), 1200);
                            }
                            tick();
                            return;
                        }
                    }
                } else {
                    state.counts[drug]++;
                    addLog(`${drugName} given`, { type: 'drug', key: drug });
                }
            }

            if (button.dataset.intervention) {
                const intv = button.dataset.intervention;
                if (intv === 'airway_sga' || intv === 'airway_ett') {
                    const k = intv === 'airway_sga' ? 'sga' : 'ett';
                    const label = k === 'sga' ? 'Airway: SGA/i-gel' : 'Airway: ETT';
                    if (state.counts[k] > 0) {
                        state.counts[k] = 0;
                        addLog(`${label} removed/inactive`, { type: 'airway', key: k });
                    } else {
                        state.counts[k] = 1;
                        state.airwayCycle = state.cycleCount;
                        addLog(`${label} inserted`, { type: 'airway', key: k });
                    }
                    if (state.currentStep === 'PERFORMING_CPR') renderGuidance();
                } else if (intv === 'access') {
                    state.counts.access++;
                    addLog('IV/IO access secured', { type: 'intervention', key: 'access' });
                }
            }

            renderInterventionButtons();
            tick();
        });

        const addCustomNote = () => {
            const val = customInterventionInput.value.trim();
            if (!val) return;
            addLog(`Note: ${val}`, { type: 'note' });
            customInterventionInput.value = '';
        };
        $('add-intervention-btn').addEventListener('click', addCustomNote);
        customInterventionInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addCustomNote(); });

        handoverNotes.addEventListener('input', () => { state.notes = handoverNotes.value; save(); });

        // Tabs
        const setMainActiveTab = (activeTab) => {
            [guidanceTab, logTab, specialCircsTab].forEach(t => {
                t.classList.remove('border-blue-500', 'text-blue-600');
                t.classList.add('border-transparent', 'text-slate-500');
            });
            activeTab.classList.add('border-blue-500', 'text-blue-600');
            activeTab.classList.remove('border-transparent', 'text-slate-500');

            logContent.classList.toggle('hidden', activeTab !== logTab);
            specialCircsContent.classList.toggle('hidden', activeTab !== specialCircsTab);
            guidanceContent.classList.toggle('hidden', activeTab !== guidanceTab);
            copyLogBtn.classList.toggle('hidden', activeTab !== logTab);
            printLogBtn.classList.toggle('hidden', activeTab !== logTab);
            if (activeTab === logTab) contentArea.scrollTop = contentArea.scrollHeight;
        };
        guidanceTab.addEventListener('click', () => setMainActiveTab(guidanceTab));
        logTab.addEventListener('click', () => setMainActiveTab(logTab));
        specialCircsTab.addEventListener('click', () => setMainActiveTab(specialCircsTab));

        // Reversible causes
        const populateReversible = () => {
            let html = `
                <div class="grid grid-cols-6 gap-2 text-[10px] uppercase font-bold text-slate-400 mb-2">
                    <div class="col-span-4">Cause</div>
                    <div class="text-center">Treated</div>
                    <div class="text-center">Likely</div>
                </div>`;
            html += reversibleCauses.map(item => `
                <div class="grid grid-cols-6 gap-2 items-center text-sm py-1 border-b border-slate-50">
                    <div class="col-span-4 font-medium text-slate-700">${item.name}</div>
                    <div class="flex justify-center">
                        <input type="checkbox" data-cause="${item.name}" data-kind="treated" ${state.reversiblesTreated[item.name] ? 'checked' : ''} class="w-5 h-5 rounded border-gray-300 text-green-600 focus:ring-green-500" aria-label="${item.name} treated">
                    </div>
                    <div class="flex justify-center">
                        <input type="checkbox" data-cause="${item.name}" data-kind="likely" ${state.reversiblesLikely[item.name] ? 'checked' : ''} class="w-5 h-5 rounded border-gray-300 text-red-600 focus:ring-red-500" aria-label="${item.name} likely">
                    </div>
                </div>`).join('');
            $('causes-checklist').innerHTML = html;
        };
        $('causes-checklist').addEventListener('change', (e) => {
            const name = e.target.dataset.cause;
            if (!name) return;
            const checked = e.target.checked;
            if (e.target.dataset.kind === 'treated') {
                if (checked) state.reversiblesTreated[name] = true; else delete state.reversiblesTreated[name];
                addLog(checked ? `Cause treated: ${name}` : `Cause un-ticked (treated): ${name}`);
            } else {
                if (checked) state.reversiblesLikely[name] = true; else delete state.reversiblesLikely[name];
                addLog(checked ? `Likely cause identified: ${name}` : `Likely cause deselected: ${name}`);
            }
        });

        // Special circumstances
        const renderSpecialCircs = () => {
            const cards = specialCircumstances.map(sc => {
                const active = !!state.specialCircs[sc.id];
                const cardClass = active ? 'bg-amber-50 border-amber-400 ring-1 ring-amber-400' : 'bg-white border-slate-200 hover:bg-slate-50';
                return `
                    <button type="button" data-circ="${sc.id}" class="special-circ-card w-full text-left p-3 rounded-lg border ${cardClass} transition-colors">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-slate-700">${sc.name}</span>
                            ${active ? '<span class="bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">ACTIVE</span>' : '<span class="text-xs text-slate-400">Tap to activate</span>'}
                        </div>
                        ${active ? `<p class="text-sm text-slate-600 mt-2 leading-snug break-words">${sc.guidance}</p>` : ''}
                    </button>`;
            }).join('');
            specialCircsContent.innerHTML = `
                <div class="text-slate-700">
                    <h3 class="font-bold text-lg mb-1">Special Circumstances (RCUK)</h3>
                    <p class="text-xs text-slate-500 mb-3">Tap to mark active — logs an event, adapts prompts and adds to the record.</p>
                    <div class="space-y-2">${cards}</div>
                </div>`;
        };

        window.toggleSpecialCirc = (id) => {
            const sc = specialCircumstances.find(s => s.id === id);
            if (!sc) return;
            if (state.specialCircs[id]) {
                delete state.specialCircs[id];
                if (state.startTime) addLog(`Special circumstance cleared: ${sc.name}`);
            } else {
                state.specialCircs[id] = true;
                if (state.startTime) addLog(`Special circumstance: ${sc.name}`);
            }
            renderSpecialCircs();
            save();
            tick();
        };
        specialCircsContent.addEventListener('click', (e) => {
            const card = e.target.closest('.special-circ-card');
            if (card) toggleSpecialCirc(card.dataset.circ);
        });

        // Metronome
        const setMetronomeButton = () => {
            metronomeBtn.innerHTML = metronome.on
                ? '<i data-lucide="volume-2" class="w-4 h-4 mr-1"></i> On'
                : '<i data-lucide="volume-x" class="w-4 h-4 mr-1"></i> Metro';
            metronomeBtn.classList.toggle('bg-slate-300', metronome.on);
            metronomeBtn.classList.toggle('text-slate-900', metronome.on);
            refreshIcons();
        };
        const stopMetronome = () => { if (metronome.on) { metronome.stop(); setMetronomeButton(); } };
        metronomeBtn.addEventListener('click', () => {
            if (metronome.on) metronome.stop();
            else if (!metronome.start()) { showToast('Audio is not available in this browser'); return; }
            setMetronomeButton();
        });

        // Keep the screen awake / catch up timers when returning to the page
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (state.isArrestActive) requestWakeLock();
                tick();
            }
        });

        // Warn before leaving the page while a record exists (it is also autosaved where storage is available)
        window.addEventListener('beforeunload', (e) => {
            if (state.startTime) { e.preventDefault(); e.returnValue = ''; }
        });

        // ---------------------------------------------------------------------------
        // Initialise
        // ---------------------------------------------------------------------------
        applyProtocolStyling();
        populateReversible();
        renderSpecialCircs();
        if (pendingRestore && pendingRestore.isArrestActive) {
            restoreSaved(true); // an arrest was in progress: go straight back to it
        } else {
            updateUI();
        }
        refreshIcons();
        setInterval(tick, 250);
    </script>
</body>
</html>
