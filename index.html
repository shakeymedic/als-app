<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resus Guide 2025 (ALS/PLS/NLS)</title>

    <!-- All assets are local so the app works offline / on locked-down networks.
         vendor/*.css and vendor/icons.js are generated by `npm run build`, which also
         produces als-standalone.html (everything inlined into one file). -->
    <link rel="stylesheet" href="vendor/inter.css">
    <link rel="stylesheet" href="vendor/tailwind.css">
    <script src="vendor/icons.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }

        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes flash-bg {
            0% { background-color: #fee2e2; }
            100% { background-color: #ffffff; }
        }
        .flash-active { animation: flash-bg 1s infinite; }

        svg.lucide { flex-shrink: 0; }

        /* Mobile: timer sticky at the top, guidance straight after it, everything else below */
        html, body { overflow-x: hidden; }
        @media (max-width: 900px) {
            #app-container { flex-direction: column !important; padding: 8px !important; gap: 12px; }
            #app-container > div { width: 100% !important; margin: 0 !important; }
            #left-column { display: contents; }
            #timer-container { order: 1; position: sticky !important; top: 0; padding: 8px 12px !important; }
            #main-panel { order: 2; }
            #controls-panel { order: 3; }
            #patient-info-display { order: 4; }
            #left-panel-combined { order: 5; }
            #timer-title { display: none; }
            #cpr-cycle-timer-large { font-size: 4rem !important; line-height: 1; margin: 0.75rem 0 !important; }
        }
        @media (max-width: 480px) {
            #total-elapsed-time { font-size: 1.5rem; }
            #cpr-cycle-timer-small { font-size: 2rem; }
        }

        /* Print: only the resuscitation record, in full */
        @media print {
            body > *:not(#summary-modal) { display: none !important; }
            #summary-modal { position: static !important; display: block !important; background: #fff !important; padding: 0 !important; }
            #summary-modal > div, #summary-content { max-height: none !important; overflow: visible !important; box-shadow: none !important; max-width: none !important; }
            .no-print { display: none !important; }
            .summary-log { max-height: none !important; overflow: visible !important; }
            details.record-details:not([open]) { display: none !important; }
            input, select { border: none !important; background: transparent !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <div id="summary-modal" class="fixed inset-0 bg-slate-900 bg-opacity-75 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col">
            <div class="p-4 sm:p-6 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-xl">
                <h2 class="text-2xl font-bold text-slate-800 flex items-center">
                    <i data-lucide="clipboard-list" class="mr-2"></i> Resuscitation Record
                </h2>
                <button onclick="closeSummary()" class="text-slate-400 hover:text-slate-600 no-print" aria-label="Close">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div id="summary-content" class="p-4 sm:p-6 space-y-4 overflow-y-auto flex-1"></div>
            <div class="p-4 border-t border-slate-200 bg-slate-50 rounded-b-xl flex flex-wrap gap-2 justify-end no-print">
                <button id="copy-record-btn" onclick="copyFullRecord(this)" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center">
                    <i data-lucide="copy" class="w-4 h-4 mr-2"></i> Copy Full Record
                </button>
                <button onclick="printRecord()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 px-4 rounded-lg flex items-center">
                    <i data-lucide="printer" class="w-4 h-4 mr-2"></i> Print
                </button>
                <button onclick="closeSummary()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 px-4 rounded-lg">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- In-page dialog (replaces confirm()/alert(), which are blocked in sandboxed pages such as SharePoint) -->
    <div id="app-dialog" class="fixed inset-0 bg-slate-900 bg-opacity-75 z-[200] hidden flex items-center justify-center p-4 no-print" role="dialog" aria-modal="true">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
            <h2 id="app-dialog-title" class="text-xl font-bold text-slate-800 mb-2"></h2>
            <div id="app-dialog-body" class="text-slate-600 text-sm mb-5"></div>
            <div id="app-dialog-buttons" class="flex flex-col gap-2"></div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[300] hidden bg-slate-800 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-lg no-print"></div>

    <div class="bg-yellow-100 border-b-2 border-yellow-300 text-yellow-800 p-2 text-center text-sm font-semibold print:hidden">
        RCUK 2025 Guidelines • Adult • Paediatric • Neonatal
    </div>

    <div class="flex items-center justify-between p-2 bg-white shadow-sm border-b border-slate-200 print:hidden">
        <div class="w-1/3 flex justify-start pl-4">
            <img src="https://iili.io/KGQOvkl.md.png" alt="" class="h-10" onerror="this.remove()">
        </div>
        <div class="w-1/3 text-center flex flex-col items-center justify-center">
             <span class="font-bold text-slate-700 leading-tight">Resuscitation Assist</span>
             <a id="guideline-link" href="https://www.resus.org.uk/sites/default/files/2025-10/Adult%20ALS%20algorithm%202025.pdf" target="_blank" rel="noopener" class="text-xs text-blue-600 hover:text-blue-800 flex items-center mt-1 font-medium hover:underline">
                <i data-lucide="file-text" class="w-3 h-3 mr-1"></i> <span id="guideline-text">ALS Guidelines 2025</span>
             </a>
        </div>
        <div class="w-1/3 flex justify-end pr-4">
             <button id="reset-app-btn" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1 rounded border border-slate-300">
                New Patient
            </button>
        </div>
    </div>

    <div id="app-container" class="p-4 flex flex-col md:flex-row md:space-x-4 print:hidden flex-grow">

        <div id="left-column" class="w-full md:w-2/5 lg:w-1/3 flex flex-col space-y-4 mb-4 md:mb-0">

            <div id="timer-container" class="bg-white p-4 rounded-xl shadow-lg sticky top-0 z-50 border-b-4 border-slate-300">
                <div class="flex justify-between items-center mb-2">
                    <h3 id="timer-title" class="font-bold text-lg text-slate-600">Timers</h3>
                    <div id="protocol-badge" class="px-2 py-0.5 rounded text-xs font-bold uppercase bg-slate-200 text-slate-600">Adult ALS</div>
                </div>
                <div class="flex justify-between items-end">
                    <div class="text-left">
                        <p id="total-label" class="text-xs text-slate-400 uppercase">Arrest Time</p>
                        <p id="total-elapsed-time" class="text-3xl font-mono font-bold text-slate-700">00:00</p>
                    </div>
                    <div class="text-right">
                        <p id="cycle-label" class="text-xs text-slate-400 uppercase">Next Rhythm Check</p>
                        <div class="flex items-center justify-end space-x-2">
                            <button id="cycle-reset-btn" onclick="resetCycleTimer()" class="hidden text-xs bg-slate-100 p-1 rounded text-slate-400 hover:text-slate-600" title="Restart cycle timer"><i data-lucide="rotate-ccw" class="w-3 h-3 m-0"></i></button>
                            <p id="cpr-cycle-timer-small" class="text-4xl font-mono font-bold text-blue-600">--:--</p>
                        </div>
                    </div>
                </div>
                <p id="timer-subline" class="hidden mt-2 text-xs font-semibold text-slate-500 text-center"></p>
            </div>

            <div id="patient-info-display" class="hidden bg-white p-3 rounded-xl shadow-lg text-xs font-mono border-2"></div>

            <div id="controls-panel" class="bg-white p-4 rounded-xl shadow-lg">
                 <h3 class="font-bold text-lg mb-3 text-center text-slate-600">Controls</h3>
                 <div class="space-y-3">
                    <button id="manual-check-btn" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-2 rounded-lg shadow-md flex items-center justify-center transition-transform transform hover:scale-105 hidden">
                        <i data-lucide="activity" class="mr-2"></i> <span id="manual-check-label">Manual Rhythm Check</span>
                    </button>
                    <button id="rosc-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-2 rounded-lg shadow-md flex items-center justify-center transition-transform transform hover:scale-105 hidden">
                        <i data-lucide="heart-pulse" class="mr-2"></i> <span id="rosc-label">ROSC Achieved</span>
                    </button>
                    <button id="rearrest-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-2 rounded-lg shadow-md flex items-center justify-center transition-transform transform hover:scale-105 hidden">
                        <i data-lucide="alert-circle" class="mr-2"></i> Rearrest
                    </button>
                    <button id="end-arrest-btn" class="w-full font-bold py-3 px-2 rounded-lg shadow-md flex items-center justify-center transition-colors bg-slate-400 text-slate-700 cursor-not-allowed" disabled>
                       <i data-lucide="square" class="mr-2"></i> End Arrest
                    </button>
                 </div>
            </div>

            <div id="left-panel-combined" class="bg-white rounded-xl shadow-lg p-4 hidden">
                 <div id="interventions-block">
                     <h3 class="font-bold text-lg mb-3 text-center text-slate-600">Interventions &amp; Drugs</h3>
                     <div id="interventions-buttons-grid" class="grid grid-cols-2 gap-2"></div>
                 </div>
                 <div class="mt-4 pt-4 border-t border-slate-200">
                     <div class="flex space-x-2">
                         <input type="text" id="custom-intervention-input" placeholder="Add note to log..." class="flex-grow bg-slate-100 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                         <button id="add-intervention-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-3 rounded-lg shadow-sm flex items-center justify-center" aria-label="Add note">
                             <i data-lucide="plus" class="w-4 h-4 m-0"></i>
                         </button>
                     </div>
                 </div>

                 <div id="reversible-causes-container" class="mt-4 pt-4 border-t border-slate-200">
                     <h3 class="font-bold text-lg mb-3 text-center text-slate-600">Reversible Causes</h3>
                     <div id="causes-checklist" class="space-y-1"></div>
                 </div>

                 <div id="notes-container" class="mt-4 pt-4 border-t border-slate-200">
                     <h3 class="font-bold text-lg mb-3 text-center text-slate-600">Handover / Notes</h3>
                     <textarea id="handover-notes" class="w-full h-24 bg-slate-100 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5" placeholder="Enter notes..."></textarea>
                 </div>
            </div>
        </div>

        <div id="main-panel" class="w-full md:w-3/5 lg:w-2/3 bg-white p-4 sm:p-6 rounded-xl shadow-lg flex flex-col">
            <div class="border-b border-slate-200 mb-4 flex flex-wrap justify-between items-center gap-2 shrink-0">
                <nav class="-mb-px flex space-x-4 sm:space-x-6 overflow-x-auto">
                    <button id="guidance-tab" class="whitespace-nowrap py-3 px-1 border-b-2 font-medium text-base sm:text-lg border-blue-500 text-blue-600">
                        Guidance
                    </button>
                    <button id="log-tab" class="whitespace-nowrap py-3 px-1 border-b-2 font-medium text-base sm:text-lg border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300">
                        <div class="flex items-center"><i data-lucide="history" class="h-5 w-5 mr-2 hidden sm:block"></i> Event Log</div>
                    </button>
                    <button id="special-circs-tab" class="whitespace-nowrap py-3 px-1 border-b-2 font-medium text-base sm:text-lg border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300">
                        <div class="flex items-center"><i data-lucide="alert-triangle" class="h-5 w-5 mr-2 hidden sm:block"></i> Special Circs</div>
                    </button>
                </nav>
                <div class="flex items-center">
                    <button id="metronome-btn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold py-2 px-3 rounded-lg mr-2 border border-slate-300 flex items-center">
                        <i data-lucide="volume-x" class="w-4 h-4 mr-1"></i> Metro
                    </button>
                    <button id="view-summary-btn" onclick="openSummaryModal()" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold py-2 px-3 rounded-lg mr-2 border border-slate-300">
                        Summary
                    </button>
                    <button id="print-log-btn" onclick="printRecord()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 px-3 rounded-lg shadow-sm flex items-center transition-colors hidden mr-2" title="Print record">
                        <i data-lucide="printer" class="w-4 h-4"></i> <span class="hidden sm:inline ml-1">Print</span>
                    </button>
                    <button id="copy-log-btn" onclick="copyFullRecord(this)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 px-3 rounded-lg shadow-sm flex items-center transition-colors hidden" title="Copy full record">
                        <i data-lucide="copy" class="w-4 h-4"></i> <span class="hidden sm:inline ml-1">Copy</span>
                    </button>
                </div>
            </div>

            <div id="content-area" class="flex-grow overflow-y-auto pr-2 pl-2 custom-scrollbar relative">
                <div id="guidance-content" class="h-full"></div>
                <div id="log-content" class="hidden"></div>
                <div id="special-circs-content" class="hidden"></div>
            </div>
        </div>

    </div>

    <footer class="mt-4 mb-4 text-center text-xs text-slate-400 no-print">
        &copy; WMEBEM 2025. Made by Dr Jake Turner.
    </footer>

    <script>
        // ---------------------------------------------------------------------------
        // Storage: localStorage when available, in-memory fallback when sandboxed
        // ---------------------------------------------------------------------------
        const _storage = (() => {
            const mem = {};
            try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return localStorage; }
            catch (e) { return { getItem: k => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: k => { delete mem[k]; } }; }
        })();
        const STORAGE_KEY = 'resus-assist-session-v2';
        const SAVE_MAX_AGE_MS = 12 * 60 * 60 * 1000;

        // ---------------------------------------------------------------------------
        // Helpers
        // ---------------------------------------------------------------------------
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const pad = n => String(n).padStart(2, '0');
        const formatTime = (secs) => {
            if (!isFinite(secs) || secs < 0) secs = 0;
            secs = Math.floor(secs);
            const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
            return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
        };
        const formatClock = ms => ms == null ? '--:--:--' : new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const formatDate = ms => ms == null ? '' : new Date(ms).toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const elapsedAt = ms => state.startTime ? Math.max(0, Math.floor((ms - state.startTime) / 1000)) : 0;
        const tPlus = ms => 'T+' + formatTime(elapsedAt(ms));
        const refreshIcons = () => { try { if (window.lucide) window.lucide.createIcons(); } catch (e) { /* icons are decorative */ } };

        const MODE_LABEL = { ADULT: 'Adult ALS', PAEDS: 'Paediatric PLS', NEO: 'Neonatal NLS' };

        // ---------------------------------------------------------------------------
        // Application state
        // ---------------------------------------------------------------------------
        const blankCounts = () => ({ adrenaline: 0, amiodarone: 0, fluids: 0, glucose: 0, access: 0, sga: 0, ett: 0, shocks: 0 });
        const blankDetails = () => ({ location: '', teamLeader: '', collapseTime: '', call2222: '', witnessed: '' });
        const newState = (mode = 'ADULT') => ({
            version: 2,
            mode,                       // 'ADULT' | 'PAEDS' | 'NEO'
            isArrestActive: false,      // episode open (in arrest or post-ROSC)
            isCprInProgress: false,
            currentStep: 'START',
            outcome: 'NONE',            // NONE | ONGOING | ROSC | STOPPED | DIED | HANDOVER
            prevOutcome: null,
            currentRhythm: null,        // 'SHOCKABLE' | 'NON_SHOCKABLE'
            cycleCount: 0,
            shocksDelivered: 0,
            counts: blankCounts(),
            log: [],
            seq: 0,
            startTime: null,
            endTime: null,
            roscTimes: [],
            rearrestTimes: [],
            cycleEndsAt: null,
            shockEnergy: null,          // adult: optional energy recorded with each shock
            airwayCycle: null,
            reversiblesTreated: {},
            reversiblesLikely: {},
            specialCircs: {},
            patientWeight: 0,
            patientAge: null,
            weightSource: null,
            wetflag: null,
            neoPhase: null,             // 'VENT' | 'CPR'
            neoCprCycles: 0,
            neoChestNotMoving: false,
            notes: '',
            details: blankDetails()
        });
        let state = newState();
        const cycleDuration = () => state.mode === 'NEO' ? 30 : 120;

        // --- Special Circumstances (RCUK) ---
        const specialCircumstances = [
            { id: 'hypothermia-severe', name: 'Hypothermia < 30 °C', guidance: 'Withhold adrenaline and amiodarone until > 30 °C. If VF persists after 3 shocks, delay further shocks until > 30 °C. Active rewarming; consider ECLS.' },
            { id: 'hypothermia-moderate', name: 'Hypothermia 30–35 °C', guidance: 'Double the interval between drug doses (adrenaline every 6–10 min). Active rewarming.' },
            { id: 'pregnancy', name: 'Pregnancy', guidance: 'Manual left uterine displacement. If no ROSC by 4 min, perimortem delivery (aim within 5 min) if uterus ≥ 20 weeks. Call obstetric + neonatal teams.' },
            { id: 'hyperkalaemia', name: 'Hyperkalaemia', guidance: 'Calcium chloride 10% 10 ml IV. Insulin 10 units + glucose 25 g IV. Consider sodium bicarbonate 50 mmol (severe acidosis / renal failure). Consider dialysis.' },
            { id: 'pe', name: 'Pulmonary embolism', guidance: 'Consider thrombolysis. If thrombolysis given, continue CPR for 60–90 min before stopping.' },
            { id: 'trauma', name: 'Traumatic arrest', guidance: 'Treat reversible causes simultaneously: haemorrhage control & volume, oxygenation, bilateral thoracostomies (tension), resuscitative thoracotomy (tamponade). Compressions must not delay these.' },
            { id: 'toxins', name: 'Toxins', guidance: 'Consult Toxbase. Consider specific antidotes. Prolonged CPR.' },
            { id: 'anaphylaxis', name: 'Anaphylaxis', guidance: 'Adrenaline 1mg IV (ALS doses). Aggressive IV fluids. Prolonged CPR.' },
            { id: 'asthma', name: 'Asthma', guidance: 'Slow ventilation rate, prolonged expiration. Exclude tension pneumothorax.' },
            { id: 'drowning', name: 'Drowning', guidance: 'Hypoxic arrest: prioritise oxygenation and ventilation (5 initial rescue breaths). Consider hypothermia.' }
        ];

        const reversibleCauses = [
            { id: 'hypoxia', name: 'Hypoxia' },
            { id: 'hypovolaemia', name: 'Hypovolaemia' },
            { id: 'hypo-hyperkalaemia', name: 'Hypo/Hyperkalaemia' },
            { id: 'hypothermia', name: 'Hypothermia' },
            { id: 'thrombosis', name: 'Thrombosis' },
            { id: 'tamponade', name: 'Tamponade (Cardiac)' },
            { id: 'toxins', name: 'Toxins' },
            { id: 'tension-pneumo', name: 'Tension Pneumothorax' },
        ];

        const RHYTHMS = {
            VF: { label: 'VF', shockable: true },
            PVT: { label: 'Pulseless VT', shockable: true },
            PEA: { label: 'PEA', shockable: false },
            ASYS: { label: 'Asystole', shockable: false }
        };

        // ---------------------------------------------------------------------------
        // Weight-based doses
        // ---------------------------------------------------------------------------
        // APLS weight estimate: < 1 yr (0.5 x months) + 4; 1–5 yr (2 x age) + 8; 6–12 yr (3 x age) + 7
        const estimateWeightFromAge = a => a < 1 ? 0.5 * (a * 12) + 4 : (a <= 5 ? 2 * a + 8 : 3 * a + 7);

        const paedsDoses = (weight, age) => {
            const w = Number(weight);
            const energy = Math.round(w * 4);
            const adrMcg = Math.min(Math.round(w * 10), 1000);    // max 1 mg
            const amio = Math.min(Math.round(w * 5), 300);         // max 300 mg
            const hasAge = age !== null && age !== '' && !isNaN(age);
            let tube = null;
            if (hasAge) {
                const a = Number(age);
                tube = a < 1
                    ? { uncuffed: '3.5–4.0', cuffed: '3.0–3.5', depth: null }
                    : { uncuffed: (a / 4 + 4).toFixed(1), cuffed: (a / 4 + 3.5).toFixed(1), depth: ((a / 4 + 4) * 3).toFixed(1) };
            }
            return {
                weight: +w.toFixed(1),
                energy,
                energyText: energy >= 150 ? `150–200 J (adult dose; 4 J/kg = ${energy} J)` : `${energy} J (4 J/kg)`,
                adrenaline_mcg: adrMcg,
                adrenaline_vol: (adrMcg / 100).toFixed(2),
                adrCapped: w * 10 > 1000,
                amiodarone: amio,
                amioCapped: w * 5 > 300,
                fluids: Math.round(w * 10),
                glucose: Math.round(w * 2),
                tube
            };
        };

        const neoDoses = (w) => ({
            adrenaline_mcg: Math.round(w * 20),
            adrenaline_vol: (w * 0.2).toFixed(2),
            fluids: Math.round(w * 10),
            glucose: +(w * 2.5).toFixed(1),
            tube: w < 1 ? '2.5' : (w < 2 ? '3.0' : (w < 3 ? '3.0–3.5' : '3.5')),
            depth: (w + 6).toFixed(1)
        });
        const neoWeight = () => state.patientWeight || 3.5;

        const paedsInfoLines = () => {
            const wf = state.wetflag;
            if (!wf) return [];
            return [
                `Weight: ${wf.weight} kg (${state.weightSource || 'entered'})${state.patientAge !== null ? ` | Age: ${state.patientAge} yr` : ''}`,
                `Energy: ${wf.energyText}`,
                `Adrenaline: ${wf.adrenaline_mcg} mcg = ${wf.adrenaline_vol} ml of 1:10,000 (10 mcg/kg${wf.adrCapped ? ', capped at 1 mg' : ''})`,
                `Amiodarone: ${wf.amiodarone} mg (5 mg/kg${wf.amioCapped ? ', capped at 300 mg' : ''})`,
                `Fluid bolus: ${wf.fluids} ml (10 ml/kg)`,
                `Glucose 10%: ${wf.glucose} ml (2 ml/kg)`,
                wf.tube ? `ETT: uncuffed ${wf.tube.uncuffed} mm / cuffed ${wf.tube.cuffed} mm${wf.tube.depth ? ` @ ~${wf.tube.depth} cm` : ''}` : 'ETT: enter age for tube size'
            ];
        };
        const neoInfoLines = () => {
            const w = neoWeight(), d = neoDoses(w);
            return [
                `Weight: ${w} kg (${state.weightSource || 'assumed'})`,
                `Adrenaline IV: ${d.adrenaline_mcg} mcg = ${d.adrenaline_vol} ml of 1:10,000 (20 mcg/kg)`,
                `Volume: ${d.fluids} ml (10 ml/kg)`,
                `Glucose 10%: ${d.glucose} ml (2.5 ml/kg)`,
                `ETT: ${d.tube} mm @ ${d.depth} cm at lip (weight + 6)`
            ];
        };

        // ---------------------------------------------------------------------------
        // Audio (Web Audio API — no external library)
        // ---------------------------------------------------------------------------
        const audio = {
            ctx: null,
            ensure() {
                try {
                    if (!this.ctx) {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (!AC) return null;
                        this.ctx = new AC();
                    }
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    return this.ctx;
                } catch (e) { return null; }
            },
            beep(freq, dur = 0.08, at = null, vol = 0.25) {
                const c = this.ctx;
                if (!c || c.state !== 'running') return;
                const t = at ?? c.currentTime;
                const o = c.createOscillator(), g = c.createGain();
                o.type = 'sine';
                o.frequency.value = freq;
                g.gain.setValueAtTime(vol, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                o.connect(g); g.connect(c.destination);
                o.start(t); o.stop(t + dur + 0.02);
            },
            endTones() {
                const c = this.ctx;
                if (!c) return;
                this.beep(660, 0.2, c.currentTime);
                this.beep(880, 0.25, c.currentTime + 0.25);
            }
        };
        // Browsers only allow audio after a user gesture; unlock on the first tap anywhere
        document.addEventListener('pointerdown', () => audio.ensure(), { capture: true });

        const metronome = {
            on: false, timer: null, next: 0, bpm: 110,
            start() {
                const c = audio.ensure();
                if (!c) return false;
                this.on = true;
                this.next = c.currentTime + 0.1;
                this.timer = setInterval(() => {
                    while (this.next < c.currentTime + 0.15) {
                        audio.beep(1000, 0.03, this.next, 0.3);
                        this.next += 60 / this.bpm;
                    }
                }, 25);
                return true;
            },
            stop() {
                this.on = false;
                clearInterval(this.timer);
                this.timer = null;
            }
        };

        // ---------------------------------------------------------------------------
        // Screen wake lock (keeps the screen on during an arrest where supported)
        // ---------------------------------------------------------------------------
        let wakeLock = null;
        const requestWakeLock = async () => {
            try {
                if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch (e) { wakeLock = null; }
        };
        const releaseWakeLock = () => { try { if (wakeLock) wakeLock.release(); } catch (e) { /* ignore */ } wakeLock = null; };

        // ---------------------------------------------------------------------------
        // DOM elements
        // ---------------------------------------------------------------------------
        const totalElapsedTimeElem = $('total-elapsed-time');
        const totalLabel = $('total-label');
        const cycleLabel = $('cycle-label');
        const cprCycleTimerSmall = $('cpr-cycle-timer-small');
        const cycleResetBtn = $('cycle-reset-btn');
        const timerSubline = $('timer-subline');
        const timerContainer = $('timer-container');
        const patientInfoDisplay = $('patient-info-display');
        const roscBtn = $('rosc-btn');
        const rearrestBtn = $('rearrest-btn');
        const metronomeBtn = $('metronome-btn');
        const endArrestBtn = $('end-arrest-btn');
        const manualCheckBtn = $('manual-check-btn');
        const guidanceTab = $('guidance-tab');
        const logTab = $('log-tab');
        const specialCircsTab = $('special-circs-tab');
        const guidanceContent = $('guidance-content');
        const logContent = $('log-content');
        const specialCircsContent = $('special-circs-content');
        const contentArea = $('content-area');
        const copyLogBtn = $('copy-log-btn');
        const printLogBtn = $('print-log-btn');
        const protocolBadge = $('protocol-badge');
        const leftPanelCombinedContainer = $('left-panel-combined');
        const interventionsBlock = $('interventions-block');
        const customInterventionInput = $('custom-intervention-input');
        const interventionsButtonsGrid = $('interventions-buttons-grid');
        const handoverNotes = $('handover-notes');
        const summaryModal = $('summary-modal');
        const summaryContent = $('summary-content');
        const viewSummaryBtn = $('view-summary-btn');

        // ---------------------------------------------------------------------------
        // Dialog, toast, clipboard
        // ---------------------------------------------------------------------------
        const showDialog = ({ title, message = '', html = null, buttons }) => new Promise(resolve => {
            const dlg = $('app-dialog');
            $('app-dialog-title').textContent = title;
            if (html !== null) $('app-dialog-body').innerHTML = html; else $('app-dialog-body').textContent = message;
            const wrap = $('app-dialog-buttons');
            wrap.innerHTML = '';
            buttons.forEach(b => {
                const el = document.createElement('button');
                el.type = 'button';
                el.className = `w-full font-bold py-3 px-4 rounded-lg ${b.cls || 'bg-slate-200 hover:bg-slate-300 text-slate-700'}`;
                el.textContent = b.label;
                el.dataset.value = b.value ?? '';
                el.addEventListener('click', () => { dlg.classList.add('hidden'); resolve(b.value); });
                wrap.appendChild(el);
            });
            dlg.classList.remove('hidden');
        });

        let toastTimer = null;
        const showToast = (msg) => {
            const t = $('toast');
            t.textContent = msg;
            t.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.add('hidden'), 4000);
        };

        const copyText = async (text, btn) => {
            let ok = false;
            try {
                if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; }
            } catch (e) { ok = false; }
            if (!ok) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    ok = document.execCommand('copy');
                    ta.remove();
                } catch (e) { ok = false; }
            }
            if (ok) {
                if (btn) {
                    const original = btn.innerHTML;
                    btn.innerHTML = '<i data-lucide="check" class="w-4 h-4 mr-2"></i> Copied!';
                    refreshIcons();
                    setTimeout(() => { btn.innerHTML = original; refreshIcons(); }, 1500);
                }
                return;
            }
            showDialog({
                title: 'Copy manually',
                html: `<p class="mb-2">Automatic copying is blocked on this page. Select all the text below and copy it.</p><textarea id="manual-copy" class="w-full h-64 text-xs font-mono border border-slate-300 rounded p-2" readonly>${esc(text)}</textarea>`,
                buttons: [{ label: 'Done', value: true }]
            });
            const ta = $('manual-copy');
            if (ta) { ta.focus(); ta.select(); }
        };

        // ---------------------------------------------------------------------------
        // Log & persistence
        // ---------------------------------------------------------------------------
        const save = () => {
            try {
                if (!state.startTime) return; // only New Patient / Clear remove a stored record
                _storage.setItem(STORAGE_KEY, JSON.stringify({ ...state, savedAt: Date.now() }));
            } catch (e) { /* storage full or blocked — app still works */ }
        };

        const loadSaved = () => {
            try {
                const raw = _storage.getItem(STORAGE_KEY);
                if (!raw) return null;
                const s = JSON.parse(raw);
                if (!s || s.version !== 2 || !s.startTime) return null;
                if (Date.now() - (s.savedAt || 0) > SAVE_MAX_AGE_MS) { _storage.removeItem(STORAGE_KEY); return null; }
                return s;
            } catch (e) { return null; }
        };
        let pendingRestore = loadSaved();

        // Log entries are appended in the order they happen (never re-sorted)
        const addLog = (message, extra = {}) => {
            state.seq += 1;
            state.log.push({ seq: state.seq, t: Date.now(), message, ...extra });
            save();
            renderLog();
        };

        const voidLast = (key) => {
            for (let i = state.log.length - 1; i >= 0; i--) {
                const e = state.log[i];
                if (e.key === key && !e.voided) { e.voided = true; return e; }
            }
            return null;
        };

        const lastAdrenalineTime = () => {
            for (let i = state.log.length - 1; i >= 0; i--) {
                const e = state.log[i];
                if (e.key === 'adrenaline' && !e.voided) return e.t;
            }
            return null;
        };

        const arrestSeconds = (now = Date.now()) => {
            if (!state.startTime) return 0;
            const starts = [state.startTime, ...state.rearrestTimes];
            let total = 0;
            starts.forEach((s, i) => {
                const e = state.roscTimes[i] ?? (state.endTime ?? now);
                total += Math.max(0, e - s);
            });
            return Math.floor(total / 1000);
        };

        const outcomeLabel = (s = state) => ({
            NONE: 'Not started',
            ONGOING: 'In progress',
            ROSC: s.endTime ? 'ROSC – care handed over' : 'ROSC (post-resuscitation care)',
            STOPPED: 'Resuscitation stopped',
            DIED: 'Died after ROSC',
            HANDOVER: 'Handed over – CPR ongoing'
        })[s.outcome] || s.outcome;

        const outcomeColour = () => state.outcome === 'ROSC' ? 'text-green-600' : (state.outcome === 'ONGOING' ? 'text-blue-600' : 'text-slate-700');

        // ---------------------------------------------------------------------------
        // Clinical prompts
        // ---------------------------------------------------------------------------
        const hasAdvancedAirway = () => state.counts.sga > 0 || state.counts.ett > 0;

        const adrenalineStatus = (now = Date.now()) => {
            const count = state.counts.adrenaline;
            const last = lastAdrenalineTime();
            const since = last ? (now - last) / 1000 : null;
            const sc = state.specialCircs;
            const interval = sc['hypothermia-moderate'] ? 360 : 180;
            const res = { due: false, reason: '', count, since, interval, withheld: false };
            if (state.outcome !== 'ONGOING') return res;
            if (state.mode !== 'NEO' && sc['hypothermia-severe']) { res.withheld = true; return res; }
            if (state.mode === 'NEO') {
                if (state.neoCprCycles >= 2) {
                    if (count === 0) { res.due = true; res.reason = 'HR < 60 despite compressions'; }
                    else if (since !== null && since >= interval) { res.due = true; res.reason = 'repeat every 3–5 min'; }
                }
                return res;
            }
            if (count === 0) {
                if (state.currentRhythm === 'NON_SHOCKABLE') { res.due = true; res.reason = 'non-shockable: give as soon as possible'; }
                else if (state.currentRhythm === 'SHOCKABLE' && state.shocksDelivered >= 3) { res.due = true; res.reason = 'after 3rd shock'; }
            } else if (since !== null && since >= interval) {
                res.due = true;
                res.reason = interval === 360 ? 'hypothermia 30–35 °C: every 6–10 min' : 'every 3–5 min';
            }
            return res;
        };

        const adrenalineDoseText = () => {
            if (state.mode === 'ADULT') return '1 mg';
            if (state.mode === 'PAEDS') return state.wetflag ? `${state.wetflag.adrenaline_mcg} mcg (${state.wetflag.adrenaline_vol} ml 1:10,000)` : '10 mcg/kg (max 1 mg)';
            const d = neoDoses(neoWeight());
            return `${d.adrenaline_mcg} mcg (${d.adrenaline_vol} ml 1:10,000) – 20 mcg/kg IV`;
        };

        const buildConsiderations = (now = Date.now()) => {
            const items = [];
            const sc = state.specialCircs;
            const adr = adrenalineStatus(now);
            const li = (cls, text) => items.push(`<li class="${cls}">${text}</li>`);

            if (state.mode === 'NEO') {
                if (state.neoPhase === 'VENT') {
                    li('text-blue-600 font-semibold', 'Watch for chest movement with each breath');
                    li('', 'SpO₂ targets (pre-ductal): 2 min 65% · 5 min 85% · 10 min 90%');
                } else {
                    li('text-blue-600 font-semibold', 'Increase oxygen to 100%');
                    if (!hasAdvancedAirway()) li('', 'Consider SGA or tracheal intubation');
                    if (state.neoCprCycles >= 2) {
                        li('text-purple-700 font-semibold', 'HR < 60: vascular access (UVC / IO) and drugs');
                        if (adr.due) li('text-purple-600 font-bold', `Give adrenaline ${adrenalineDoseText()}${adr.count ? ' – repeat dose due' : ''}`);
                        li('', `Consider volume ${neoDoses(neoWeight()).fluids} ml (10 ml/kg) and glucose; pneumothorax, hypovolaemia, congenital abnormality`);
                    }
                }
            } else {
                if (adr.withheld) li('text-sky-700 font-bold', 'Hypothermia < 30 °C: withhold adrenaline & amiodarone');
                else if (adr.due) li('text-purple-600 font-bold', `Give adrenaline ${adrenalineDoseText()} <span class="font-normal">(${adr.reason})</span>`);
                else if (adr.count > 0 && adr.since === null) li('text-purple-600', 'Adrenaline given pre-arrival (time unknown): repeat every 3–5 min');

                if (!sc['hypothermia-severe'] && state.currentRhythm === 'SHOCKABLE') {
                    const paedsAmio = state.wetflag ? `${state.wetflag.amiodarone} mg` : '5 mg/kg (max 300 mg)';
                    if (state.shocksDelivered >= 3 && state.counts.amiodarone === 0) li('text-orange-600 font-bold', `Give amiodarone ${state.mode === 'ADULT' ? '300 mg' : paedsAmio}`);
                    else if (state.shocksDelivered >= 5 && state.counts.amiodarone === 1) li('text-orange-600 font-bold', `Give amiodarone ${state.mode === 'ADULT' ? '150 mg' : paedsAmio + ' (2nd dose)'}`);
                }
                if (state.mode === 'ADULT' && state.currentRhythm === 'SHOCKABLE' && state.shocksDelivered >= 3) {
                    li('text-blue-600 font-semibold', 'Consider changing pad position (e.g. anterior–posterior)');
                }
                if (sc['hypothermia-severe'] && state.currentRhythm === 'SHOCKABLE' && state.shocksDelivered >= 3) {
                    li('text-sky-700 font-bold', 'Hypothermia < 30 °C: no further shocks until > 30 °C');
                }
                if (state.mode === 'PAEDS' && state.counts.ett > 0) li('text-slate-500 italic', 'Tube problems? DOPE (Displacement, Obstruction, Pneumothorax, Equipment)');
                if (sc.pregnancy && arrestSeconds(now) < 600) li('text-pink-700 font-bold', `Pregnancy: perimortem delivery if no ROSC by 4 min (now T+${formatTime(arrestSeconds(now))})`);
                if (sc.pe) li('text-slate-700', 'PE: if thrombolysed, continue CPR 60–90 min');
            }
            if (hasAdvancedAirway() && state.airwayCycle !== null && state.cycleCount - state.airwayCycle <= 1) {
                li('text-slate-700', 'Confirm airway with waveform capnography');
            }
            const shown = ['hypothermia-severe', 'hypothermia-moderate', 'pregnancy', 'pe'];
            const others = specialCircumstances.filter(s => sc[s.id] && !shown.includes(s.id)).map(s => s.name);
            if (others.length) li('text-amber-700', `Special circumstances: ${others.join(', ')} (see Special Circs tab)`);

            if (!items.length) return '';
            return `
                <div class="mt-4 bg-yellow-50 p-4 rounded-lg border-l-4 border-yellow-400 text-left">
                    <h4 class="font-bold text-slate-700 mb-1">Clinical Actions:</h4>
                    <ul class="list-disc list-inside text-sm space-y-1">${items.join('')}</ul>
                </div>`;
        };
        let lastConsiderations = '';

        // ---------------------------------------------------------------------------
        // Protocol selection
        // ---------------------------------------------------------------------------
        const applyProtocolStyling = () => {
            const mode = state.mode;
            const link = $('guideline-link');
            const linkText = $('guideline-text');
            timerContainer.classList.remove('border-slate-300', 'border-blue-500', 'border-teal-500', 'border-pink-500');
            if (mode === 'NEO') {
                protocolBadge.className = 'px-2 py-0.5 rounded text-xs font-bold uppercase bg-pink-100 text-pink-700';
                timerContainer.classList.add('border-pink-500');
                link.href = 'https://www.resus.org.uk/sites/default/files/2025-11/RCUK%20G2025%20NEO%20NLS%20Oct%20V2%201.pdf';
                linkText.innerText = 'NLS Guidelines 2025';
            } else if (mode === 'PAEDS') {
                protocolBadge.className = 'px-2 py-0.5 rounded text-xs font-bold uppercase bg-teal-100 text-teal-700';
                timerContainer.classList.add('border-teal-500');
                link.href = 'https://www.resus.org.uk/sites/default/files/2025-10/Paediatric%20advanced%20life%20support%20algorithm%202025.pdf';
                linkText.innerText = 'PLS Guidelines 2025';
            } else {
                protocolBadge.className = 'px-2 py-0.5 rounded text-xs font-bold uppercase bg-blue-100 text-blue-700';
                timerContainer.classList.add('border-blue-500');
                link.href = 'https://www.resus.org.uk/sites/default/files/2025-10/Adult%20ALS%20algorithm%202025.pdf';
                linkText.innerText = 'ALS Guidelines 2025';
            }
            protocolBadge.innerText = MODE_LABEL[mode];
        };

        window.setProtocol = (mode) => {
            if (state.startTime) return; // protocol is fixed once an episode has started
            if (mode !== state.mode) {
                // Never carry a weight (and weight-based doses) across protocols
                state.patientWeight = 0;
                state.patientAge = null;
                state.weightSource = null;
                state.wetflag = null;
            }
            state.mode = mode;
            applyProtocolStyling();
            updateUI();
        };

        // ---------------------------------------------------------------------------
        // Rendering
        // ---------------------------------------------------------------------------
        const infoGrid = (lines, cls) => `<div class="grid grid-cols-1 gap-y-1 ${cls}">${lines.map(l => `<div>${esc(l)}</div>`).join('')}</div>`;

        const updatePatientInfoDisplay = () => {
            let html = '';
            if (state.startTime && state.mode === 'PAEDS' && state.wetflag) {
                patientInfoDisplay.className = 'bg-white p-3 rounded-xl shadow-lg text-xs font-mono border-2 bg-teal-50 border-teal-300';
                html = `<div class="font-bold text-teal-800 mb-2 text-center text-sm">WETFLAG Quick Reference</div>${infoGrid(paedsInfoLines(), 'text-teal-900')}`;
            } else if (state.startTime && state.mode === 'NEO') {
                patientInfoDisplay.className = 'bg-white p-3 rounded-xl shadow-lg text-xs font-mono border-2 bg-pink-50 border-pink-300';
                html = `<div class="font-bold text-pink-800 mb-2 text-center text-sm">Neonatal Quick Reference</div>${infoGrid(neoInfoLines(), 'text-pink-900')}`;
            }
            patientInfoDisplay.innerHTML = html;
            patientInfoDisplay.classList.toggle('hidden', !html);
        };

        const renderInterventionButtons = () => {
            if (!state.isArrestActive) { interventionsButtonsGrid.innerHTML = ''; return; }
            let html = '';
            const badge = (count) => count > 0 ? `
                <span class="absolute top-1 right-1 flex items-center space-x-1">
                    <span class="decrement-btn bg-white/30 hover:bg-white/50 text-white rounded-full w-6 h-6 flex items-center justify-center cursor-pointer text-xs font-bold" title="Undo (recorded in error)" role="button">-</span>
                    <span class="bg-white text-slate-800 text-xs font-bold px-1.5 rounded-full shadow border border-slate-200">${count}</span>
                </span>` : '';
            const accessBadge = (count) => count > 0 ? `
                <span class="absolute top-1 right-1 flex items-center space-x-1">
                    <span class="decrement-btn bg-slate-300 hover:bg-slate-400 text-slate-700 rounded-full w-6 h-6 flex items-center justify-center cursor-pointer text-xs font-bold" title="Undo (recorded in error)" role="button">-</span>
                    <span class="bg-white text-slate-800 text-xs font-bold px-1.5 rounded-full shadow border border-slate-200">${count}</span>
                </span>` : '';
            const airwayStatus = (isActive) => isActive ? `<span class="absolute top-1 right-1 bg-green-500 text-white text-[10px] font-bold px-1.5 rounded shadow">ACTIVE</span>` : '';
            const airwayClass = (isActive) => isActive
                ? 'bg-slate-200 text-slate-900 border-green-500 ring-1 ring-green-500'
                : 'bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-300';

            html += `
                <button data-intervention="airway_sga" class="relative w-full ${airwayClass(state.counts.sga > 0)} font-semibold py-2 px-2 rounded-lg shadow-sm text-xs border">
                    Airway (SGA/iGel) ${airwayStatus(state.counts.sga > 0)}
                </button>
                <button data-intervention="airway_ett" class="relative w-full ${airwayClass(state.counts.ett > 0)} font-semibold py-2 px-2 rounded-lg shadow-sm text-xs border">
                    Airway (ETT) ${airwayStatus(state.counts.ett > 0)}
                </button>
                <div class="col-span-2">
                     <button data-intervention="access" class="relative w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-2 rounded-lg shadow-sm text-xs border border-slate-300">
                        IV/IO Access Secured ${accessBadge(state.counts.access)}
                     </button>
                </div>
            `;

            const drugBtn = (drug, name, colour, main, sub, span2 = false) => `
                <button data-drug="${drug}" data-drug-name="${esc(name)}" class="relative ${span2 ? 'col-span-2 ' : ''}w-full ${colour} text-white font-semibold py-2 px-2 rounded-lg shadow-sm text-sm flex flex-col items-center transition-all transform active:scale-95">
                    <span>${main}</span>
                    ${sub ? `<span class="text-[10px] font-normal opacity-90">${sub}</span>` : ''}
                    ${badge(state.counts[drug])}
                </button>`;

            if (state.mode === 'ADULT') {
                const amioNext = state.counts.amiodarone === 0 ? '300 mg' : '150 mg';
                html += drugBtn('adrenaline', 'Adrenaline 1 mg', 'bg-purple-500 hover:bg-purple-600', 'Adrenaline 1mg', '');
                html += drugBtn('amiodarone', `Amiodarone ${amioNext}`, 'bg-orange-500 hover:bg-orange-600', 'Amiodarone', `next: ${amioNext}`);
                html += drugBtn('fluids', 'Fluid 500 ml', 'bg-blue-500 hover:bg-blue-600', 'Fluid 500ml', '', true);
            } else if (state.mode === 'PAEDS' && state.wetflag) {
                const wf = state.wetflag;
                html += drugBtn('adrenaline', `Adrenaline ${wf.adrenaline_mcg} mcg (${wf.adrenaline_vol} ml 1:10,000)`, 'bg-purple-500 hover:bg-purple-600', `Adrenaline ${wf.adrenaline_mcg}mcg`, `(${wf.adrenaline_vol}ml of 1:10k${wf.adrCapped ? ', max' : ''})`);
                html += drugBtn('amiodarone', `Amiodarone ${wf.amiodarone} mg (5 mg/kg${wf.amioCapped ? ', max 300 mg' : ''})`, 'bg-orange-500 hover:bg-orange-600', `Amiodarone ${wf.amiodarone}mg`, wf.amioCapped ? '(max dose)' : '(5mg/kg)');
                html += drugBtn('fluids', `Fluid ${wf.fluids} ml (10 ml/kg)`, 'bg-blue-500 hover:bg-blue-600', `Fluid ${wf.fluids}ml`, '(10ml/kg)');
                html += drugBtn('glucose', `Glucose 10% ${wf.glucose} ml (2 ml/kg)`, 'bg-yellow-500 hover:bg-yellow-600', `Glucose ${wf.glucose}ml`, '(10%, 2ml/kg)');
            } else if (state.mode === 'PAEDS') {
                html += `
                    <div class="col-span-2 text-center text-sm text-teal-800 bg-teal-50 border border-teal-200 rounded-lg p-3">
                        <p class="font-semibold mb-2">Enter weight for weight-based drug doses</p>
                        <div class="flex space-x-2 justify-center">
                            <input type="number" id="paeds-drug-weight" placeholder="Weight (kg)" step="0.1" min="0.5" max="150" class="p-2 border rounded w-28 text-center text-slate-900">
                            <button type="button" id="paeds-weight-set" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-3 rounded shadow">Set</button>
                        </div>
                    </div>`;
            } else if (state.mode === 'NEO') {
                const d = neoDoses(neoWeight());
                html += drugBtn('adrenaline', `Adrenaline ${d.adrenaline_mcg} mcg IV (${d.adrenaline_vol} ml 1:10,000)`, 'bg-purple-500 hover:bg-purple-600', `Adrenaline ${d.adrenaline_vol}ml`, '(1:10,000, 20mcg/kg)');
                html += drugBtn('fluids', `Volume ${d.fluids} ml (10 ml/kg)`, 'bg-blue-500 hover:bg-blue-600', `Volume ${d.fluids}ml`, '(10ml/kg)');
                html += drugBtn('glucose', `Glucose 10% ${d.glucose} ml (2.5 ml/kg)`, 'bg-yellow-500 hover:bg-yellow-600', `Glucose ${d.glucose}ml`, '(10%, 2.5ml/kg)', true);
            }
            interventionsButtonsGrid.innerHTML = html;
        };

        const wetflagResultsHtml = () => state.wetflag
            ? `<div id="wetflag-results" class="text-xs text-teal-800 mt-3 p-2 bg-white rounded border border-teal-300 space-y-1">${paedsInfoLines().map(l => `<div>${esc(l)}</div>`).join('')}</div>`
            : '<div id="wetflag-results" class="hidden"></div>';

        const neoResultsHtml = () => state.patientWeight
            ? `<div id="neo-results" class="text-xs text-pink-800 mt-3 p-2 bg-white rounded border border-pink-300 space-y-1">${neoInfoLines().map(l => `<div>${esc(l)}</div>`).join('')}</div>`
            : '<div id="neo-results" class="hidden"></div>';

        const renderGuidance = () => {
            let content = '';
            const mode = state.mode;
            const airway = hasAdvancedAirway();

            switch (state.currentStep) {
                case 'START': {
                    const saved = pendingRestore;
                    content = `
                        <div class="text-center h-full flex flex-col justify-start pt-4">
                            ${saved ? `
                            <div class="mb-6 p-3 rounded-lg border border-amber-300 bg-amber-50 text-left text-sm text-amber-900 flex flex-wrap items-center justify-between gap-2">
                                <span><strong>Previous record on this device:</strong> ${esc(MODE_LABEL[saved.mode])}, started ${esc(formatDate(saved.startTime))} ${esc(formatClock(saved.startTime))} – ${esc(outcomeLabel(saved))}</span>
                                <span class="flex gap-2">
                                    <button data-action="resume-saved" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-1 px-3 rounded">Open</button>
                                    <button data-action="discard-saved" class="bg-white border border-amber-300 text-amber-800 font-bold py-1 px-3 rounded">Clear</button>
                                </span>
                            </div>` : ''}
                            <h2 class="text-2xl font-bold text-slate-700 mb-6">Select Protocol</h2>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                                <button data-action="protocol" data-mode="ADULT" class="${mode === 'ADULT' ? 'ring-4 ring-blue-500 font-bold bg-blue-700' : 'opacity-70 hover:opacity-100 bg-blue-600'} text-white p-4 rounded-xl shadow-lg transition-all">
                                    <div class="text-lg">Adult ALS</div>
                                </button>
                                <button data-action="protocol" data-mode="PAEDS" class="${mode === 'PAEDS' ? 'ring-4 ring-teal-500 font-bold bg-teal-600' : 'opacity-70 hover:opacity-100 bg-teal-500'} text-white p-4 rounded-xl shadow-lg transition-all">
                                    <div class="text-lg">Paediatric PLS</div>
                                </button>
                                <button data-action="protocol" data-mode="NEO" class="${mode === 'NEO' ? 'ring-4 ring-pink-500 font-bold bg-pink-600' : 'opacity-70 hover:opacity-100 bg-pink-500'} text-white p-4 rounded-xl shadow-lg transition-all">
                                    <div class="text-lg">Neonatal NLS</div>
                                </button>
                            </div>

                            ${mode === 'PAEDS' ? `
                            <div class="bg-teal-50 p-4 rounded-lg mb-6 text-left border border-teal-200">
                                <h3 class="font-bold text-teal-700 mb-2">WETFLAG Calculator <span class="font-normal text-xs text-teal-600">(optional – can also be set during the arrest)</span></h3>
                                <div class="flex space-x-2 mb-2">
                                    <input type="number" id="input-age" placeholder="Age (years)" step="0.1" min="0" max="18" value="${state.patientAge ?? ''}" class="p-2 border rounded w-1/3">
                                    <input type="number" id="input-weight" placeholder="Weight (kg)" step="0.1" min="0.5" max="150" value="${state.patientWeight || ''}" class="p-2 border rounded w-1/3">
                                    <button data-action="calc-age" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded w-1/3 shadow">Calculate</button>
                                </div>
                                <p class="text-xs text-teal-700">Age estimates weight (APLS). Under 1 year: use decimals (0.5 = 6 months). Actual weight overrides the estimate.</p>
                                ${wetflagResultsHtml()}
                            </div>` : ''}

                            ${mode === 'NEO' ? `
                            <div class="bg-pink-50 p-4 rounded-lg mb-6 text-left border border-pink-200">
                                <h3 class="font-bold text-pink-700 mb-2">Neonatal Weight <span class="font-normal text-xs text-pink-600">(optional)</span></h3>
                                <input type="number" id="input-neo-weight" placeholder="Weight (kg) – default 3.5" step="0.1" min="0.3" max="7" value="${state.patientWeight || ''}" class="p-2 border rounded w-full">
                                <p class="text-xs text-pink-600 mt-2">If left blank, 3.5 kg (term baby) is assumed and recorded as assumed.</p>
                                ${neoResultsHtml()}
                            </div>` : ''}

                            <div class="space-y-4">
                                <button id="start-arrest-btn" data-action="start" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-4 rounded-lg text-xl shadow-lg flex items-center justify-center">
                                    <i data-lucide="play" class="mr-2"></i> ${mode === 'NEO' ? 'Start Resuscitation (Time 00:00)' : 'Start New Arrest (Time 00:00)'}
                                </button>
                                ${mode !== 'NEO' ? `
                                <button id="pre-arrested-btn" data-action="pre-arrived" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-4 px-4 rounded-lg text-xl shadow-lg flex items-center justify-center">
                                    <i data-lucide="ambulance" class="mr-2"></i> Patient Arrived in Arrest
                                </button>` : ''}
                            </div>
                        </div>`;
                    break;
                }

                case 'PRE_ARREST_INFO':
                    content = `
                        <div>
                            <h2 class="text-2xl font-bold text-slate-700 mb-1 text-center">Pre-Arrival Information</h2>
                            <p class="text-sm text-slate-500 text-center mb-4">Optional – leave at 0 if unknown.</p>
                            <div class="space-y-4 text-slate-800 bg-slate-100 p-4 rounded-lg">
                                ${[['pre-cycles', 'Cycles Completed'], ['pre-shocks', 'Shocks Delivered'], ['pre-adrenaline', 'Adrenaline Doses'], ['pre-amiodarone', 'Amiodarone Doses']].map(([id, label]) => `
                                <div class="flex items-center justify-between">
                                    <label for="${id}" class="font-medium">${label}:</label>
                                    <input type="number" id="${id}" min="0" max="50" value="0" class="w-24 p-2 text-center border rounded-md shadow-sm">
                                </div>`).join('')}
                            </div>
                            <div class="mt-8 space-y-3">
                                <button id="continue-from-pre-arrest-btn" data-action="pre-continue" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-4 rounded-lg text-xl shadow-lg flex items-center justify-center">
                                    Continue to Rhythm Check
                                </button>
                                <button data-action="pre-back" class="w-full text-slate-500 hover:text-slate-700 text-sm underline">Back</button>
                            </div>
                        </div>`;
                    break;

                case 'NEO_AIRWAY':
                    content = `
                        <div class="text-left">
                            <h2 class="text-2xl font-bold text-pink-600 text-center mb-4">Airway &amp; Inflation Breaths</h2>
                            ${state.neoChestNotMoving ? `
                            <div class="mb-4 p-4 bg-amber-50 border-l-4 border-amber-400 rounded text-sm">
                                <p class="font-bold text-amber-800 mb-1">Chest not moving:</p>
                                <ul class="list-disc list-inside text-amber-900 space-y-1">
                                    <li>Recheck head position and mask seal</li>
                                    <li>2-person airway support / jaw thrust</li>
                                    <li>Inspect pharynx, suction under direct vision</li>
                                    <li>Consider SGA or tracheal intubation</li>
                                    <li>Consider increasing inflation pressure</li>
                                </ul>
                            </div>` : ''}
                            <ul class="list-disc list-inside text-slate-700 space-y-2 bg-pink-50 p-4 rounded-lg">
                                <li>Dry, stimulate, keep warm; assess tone, breathing, heart rate</li>
                                <li>Open airway: neutral head position</li>
                                <li><strong>5 inflation breaths</strong>: 2–3 s each, 30 cmH₂O (25 cmH₂O if &lt; 32 weeks)</li>
                                <li>Start in air (≥ 32 weeks); 21–30% O₂ if 28–31 weeks; 30% if &lt; 28 weeks</li>
                            </ul>
                            <button id="neo-inflation-btn" data-action="neo-inflation" class="mt-6 w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-5 px-4 rounded-lg text-xl shadow-lg">
                                ${state.neoChestNotMoving ? 'Inflation breaths repeated' : 'Inflation breaths given'} → Reassess
                            </button>
                        </div>`;
                    break;

                case 'ASSESS_RHYTHM':
                    if (mode === 'NEO') {
                        content = `
                            <div class="text-center">
                                <h2 class="text-2xl font-bold text-yellow-500 flex items-center justify-center mb-2"><i data-lucide="alert-triangle" class="mr-2"></i>Reassess</h2>
                                <p class="text-slate-600 mb-6">Heart rate and chest movement</p>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <button id="neo-hr-lt60-btn" data-action="neo-cpr" class="bg-red-500 hover:bg-red-600 text-white font-bold py-6 px-4 rounded-lg text-lg shadow-md">
                                        HR &lt; 60 – Compressions 3:1
                                        <span class="block text-xs font-normal opacity-90">after 30 s of effective ventilation</span>
                                    </button>
                                    <button id="neo-hr-ge60-btn" data-action="neo-vent" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-6 px-4 rounded-lg text-lg shadow-md">
                                        HR ≥ 60 – Ventilate
                                        <span class="block text-xs font-normal opacity-90">no compressions</span>
                                    </button>
                                    <button id="neo-chest-btn" data-action="neo-chest" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 px-4 rounded-lg shadow-md">
                                        Chest not moving
                                    </button>
                                    <button id="assess-rosc-btn" data-action="rosc" class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-4 rounded-lg shadow-md">
                                        HR &gt; 100 &amp; breathing – Stable
                                    </button>
                                </div>
                            </div>`;
                    } else {
                        const hypoNoShock = state.specialCircs['hypothermia-severe'] && state.shocksDelivered >= 3;
                        content = `
                            <div class="text-center">
                                <h2 class="text-2xl font-bold text-yellow-500 flex items-center justify-center mb-6"><i data-lucide="alert-triangle" class="mr-2"></i>Assess Rhythm</h2>
                                ${hypoNoShock ? '<p class="mb-4 p-2 bg-sky-50 border border-sky-300 rounded text-sky-800 text-sm font-semibold">Hypothermia &lt; 30 °C: 3 shocks given – delay further shocks until &gt; 30 °C</p>' : ''}
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div class="rounded-xl border-2 border-red-300 bg-red-50 p-3">
                                        <p class="text-xs font-bold text-red-700 uppercase mb-2">Shockable</p>
                                        <div class="grid grid-cols-2 gap-2">
                                            <button id="rhythm-vf-btn" data-action="rhythm" data-rhythm="VF" class="bg-red-500 hover:bg-red-600 text-white font-bold py-6 px-2 rounded-lg text-lg shadow-md">VF</button>
                                            <button id="rhythm-pvt-btn" data-action="rhythm" data-rhythm="PVT" class="bg-red-500 hover:bg-red-600 text-white font-bold py-6 px-2 rounded-lg text-lg shadow-md">pVT</button>
                                        </div>
                                    </div>
                                    <div class="rounded-xl border-2 border-blue-300 bg-blue-50 p-3">
                                        <p class="text-xs font-bold text-blue-700 uppercase mb-2">Non-shockable</p>
                                        <div class="grid grid-cols-2 gap-2">
                                            <button id="rhythm-pea-btn" data-action="rhythm" data-rhythm="PEA" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-6 px-2 rounded-lg text-lg shadow-md">PEA</button>
                                            <button id="rhythm-asys-btn" data-action="rhythm" data-rhythm="ASYS" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-6 px-2 rounded-lg text-lg shadow-md">Asystole</button>
                                        </div>
                                    </div>
                                </div>
                                <button id="assess-rosc-btn" data-action="rosc" class="mt-4 w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow-md">
                                    Pulse / signs of life – ROSC
                                </button>
                            </div>`;
                    }
                    break;

                case 'SHOCKABLE': {
                    let energyHtml;
                    if (mode === 'ADULT') {
                        energyHtml = `
                            <p class="text-slate-500 mb-3">Energy: <strong>150–200 J biphasic (per device); escalate if possible</strong></p>
                            <div class="flex flex-wrap items-center justify-center gap-2 mb-6 text-sm">
                                <span class="text-slate-400">Record energy (optional):</span>
                                ${[150, 200, 360].map(j => `<button data-action="energy" data-energy="${j}" class="px-3 py-1 rounded-full border ${state.shockEnergy === j ? 'bg-red-600 text-white border-red-600' : 'bg-white text-slate-600 border-slate-300'}">${j} J</button>`).join('')}
                            </div>`;
                    } else {
                        energyHtml = `<p class="text-slate-500 mb-8">Energy: <strong>${state.wetflag ? esc(state.wetflag.energyText) : '4 J/kg'}</strong></p>`;
                    }
                    const hypoWarn = state.specialCircs['hypothermia-severe'] && state.shocksDelivered >= 3;
                    content = `
                        <div class="text-center h-full flex flex-col justify-start pt-4">
                            <h2 class="text-3xl font-bold text-red-500 mb-2">Shockable Rhythm</h2>
                            ${energyHtml}
                            ${hypoWarn ? '<p class="mb-4 p-2 bg-sky-50 border border-sky-300 rounded text-sky-800 text-sm font-semibold">Hypothermia &lt; 30 °C: 3 shocks already given – delay further shocks until &gt; 30 °C</p>' : ''}
                            <button id="deliver-shock-btn" data-action="shock" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-8 px-4 rounded-xl text-2xl shadow-xl flex items-center justify-center animate-pulse">
                                <i data-lucide="zap" class="w-8 h-8 mr-2"></i> Deliver Shock ${state.shocksDelivered + 1}
                            </button>
                            <p class="text-xs text-slate-500 mt-4 max-w-md mx-auto">Pad placement (RCUK 2025): sternal pad below right clavicle; lateral pad mid-axillary line, directly under the armpit (V6 position).</p>
                            <button data-action="shock-back" class="mt-4 text-sm text-slate-500 hover:text-slate-700 underline">Not shocked – back to rhythm check</button>
                        </div>`;
                    break;
                }

                case 'PERFORMING_CPR': {
                    let cprText, subText = '';
                    if (mode === 'NEO') {
                        cprText = state.neoPhase === 'VENT' ? 'Ventilate ~30 breaths/min' : '3 compressions : 1 breath';
                        subText = 'Reassess heart rate every 30 s';
                    } else if (airway) {
                        cprText = 'Continuous Compressions';
                        subText = 'Ventilations independent of compressions (appropriate rate)';
                    } else {
                        cprText = mode === 'PAEDS' ? '15:2 Ratio' : '30:2 Ratio';
                    }
                    const remaining = state.cycleEndsAt ? Math.max(0, Math.ceil((state.cycleEndsAt - Date.now()) / 1000)) : cycleDuration();
                    lastConsiderations = buildConsiderations();
                    content = `
                        <div class="text-center flex flex-col h-full justify-between">
                            <div>
                                <p class="text-2xl font-semibold text-slate-600">${mode === 'NEO' ? (state.neoPhase === 'VENT' ? 'Ventilation' : 'Compressions in Progress') : 'CPR in Progress'}</p>
                                <p id="cpr-cycle-timer-large" class="text-9xl font-mono font-bold text-green-500 my-8">${formatTime(remaining)}</p>
                                <p class="text-xl ${airway || mode === 'NEO' ? 'text-blue-600 font-bold' : 'text-slate-500'}">${cprText}</p>
                                ${subText ? `<p class="text-sm text-slate-500 mt-2">${subText}</p>` : ''}
                                ${mode !== 'NEO' ? `
                                <div class="mt-4 text-left bg-indigo-50 p-3 rounded-lg border border-indigo-100">
                                    <div class="font-bold text-indigo-800 text-sm mb-1">Check Reversible Causes</div>
                                    <div class="grid grid-cols-2 gap-2 text-xs text-indigo-700">
                                        <div>
                                            <span class="font-semibold block mb-0.5">4 Hs</span>
                                            <ul class="list-disc list-inside leading-tight"><li>Hypoxia</li><li>Hypovolaemia</li><li>Hyper/Hypokal.</li><li>Hypothermia</li></ul>
                                        </div>
                                        <div>
                                            <span class="font-semibold block mb-0.5">4 Ts</span>
                                            <ul class="list-disc list-inside leading-tight"><li>Thrombosis</li><li>Tamponade</li><li>Toxins</li><li>Tension Pn.</li></ul>
                                        </div>
                                    </div>
                                </div>` : ''}
                                <div id="considerations">${lastConsiderations}</div>
                            </div>
                        </div>`;
                    break;
                }

                case 'POST_ROSC': {
                    let body;
                    if (mode === 'NEO') {
                        body = `
                            <h3 class="font-bold text-lg text-slate-700 border-b border-green-200 pb-1">Post-Resuscitation Care (Neonate)</h3>
                            <ul class="list-disc list-inside text-sm text-slate-600 ml-2 space-y-1">
                                <li>Maintain temperature 36.5–37.5 °C</li>
                                <li>Pre-ductal SpO₂ monitoring; titrate oxygen</li>
                                <li>Check blood glucose</li>
                                <li>Senior neonatal review; consider therapeutic hypothermia criteria</li>
                                <li>Update parents; document timings</li>
                            </ul>`;
                    } else if (mode === 'PAEDS') {
                        body = `
                            <h3 class="font-bold text-lg text-slate-700 border-b border-green-200 pb-1">Post-Resuscitation Care (Child)</h3>
                            <ul class="list-disc list-inside text-sm text-slate-600 ml-2 space-y-1">
                                <li>A/B: SpO₂ 94–98%, normocapnia; avoid hyperventilation</li>
                                <li>C: Avoid hypotension (systolic BP &gt; 5th centile for age); fluids / inotropes</li>
                                <li>D: Normoglycaemia; treat seizures</li>
                                <li>E: Avoid fever (temperature ≤ 37.5 °C)</li>
                                <li>Contact paediatric critical care / retrieval</li>
                            </ul>`;
                    } else {
                        body = `
                            <h3 class="font-bold text-lg text-slate-700 border-b border-green-200 pb-1">Immediate Post-Resuscitation Care (ABCDE)</h3>
                            <div><p class="font-semibold text-slate-700">A - Airway</p><ul class="list-disc list-inside text-sm text-slate-600 ml-2"><li>Maintain patent airway.</li><li>Intubate if unconscious (avoid hyperventilation).</li></ul></div>
                            <div><p class="font-semibold text-slate-700">B - Breathing</p><ul class="list-disc list-inside text-sm text-slate-600 ml-2"><li>Aim SpO<sub>2</sub> 94-98%.</li><li>Aim normal PaCO<sub>2</sub> (4.5-6.0 kPa).</li><li>Protective lung ventilation strategy.</li></ul></div>
                            <div><p class="font-semibold text-slate-700">C - Circulation</p><ul class="list-disc list-inside text-sm text-slate-600 ml-2"><li>12-lead ECG: Urgent PCI for STEMI?</li><li>Aim SBP &gt; 100 mmHg (MAP &gt; 65 mmHg).</li><li>Fluid bolus / Vasopressors (Noradrenaline).</li></ul></div>
                            <div><p class="font-semibold text-slate-700">D - Disability</p><ul class="list-disc list-inside text-sm text-slate-600 ml-2"><li>Control Glucose (4-10 mmol/L).</li><li>Treat Seizures.</li><li>Sedation for shivering/agitation.</li></ul></div>
                            <div><p class="font-semibold text-slate-700">E - Exposure / Temperature</p><ul class="list-disc list-inside text-sm text-slate-600 ml-2"><li>Targeted Temperature Management.</li><li>Maintain temp &le; 37.5&deg;C (prevent fever).</li></ul></div>
                            <div class="mt-4 pt-4 border-t border-green-200">
                                <a href="https://www.resus.org.uk/sites/default/files/2025-10/Adult%20post-resuscitation%20care%202025.pdf" target="_blank" rel="noopener" class="inline-flex items-center justify-center w-full px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-md shadow-sm transition-colors">
                                    <i data-lucide="external-link" class="w-4 h-4 mr-2"></i> View Full 2025 RCUK Post-ROSC Guide
                                </a>
                            </div>`;
                    }
                    content = `
                        <div class="text-center p-4 bg-green-50 rounded-lg h-full border border-green-200 overflow-y-auto">
                            <h2 class="text-2xl font-bold text-green-600 flex items-center justify-center mb-4">
                                <i data-lucide="check-circle" class="mr-2 w-8 h-8"></i>${mode === 'NEO' ? 'Stabilised' : 'ROSC Achieved'}
                            </h2>
                            <div class="text-left space-y-3">
                                <div class="bg-white p-3 rounded border border-green-100 mb-4 shadow-sm text-center">
                                    <button data-action="view-summary" class="text-green-700 font-bold underline hover:text-green-800">View &amp; Copy Resus Record</button>
                                </div>
                                ${body}
                            </div>
                        </div>`;
                    break;
                }

                case 'ENDED':
                    content = `
                        <div class="text-center pt-6">
                            <h2 class="text-2xl font-bold text-slate-700 mb-2">Episode Ended</h2>
                            <p class="text-lg font-semibold ${outcomeColour()} mb-1">${esc(outcomeLabel())}</p>
                            <p class="text-sm text-slate-500 mb-6">${esc(formatDate(state.endTime))} ${esc(formatClock(state.endTime))} (${esc(tPlus(state.endTime))})</p>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 max-w-xl mx-auto">
                                <button data-action="view-summary" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-4 rounded-lg">View Record</button>
