# Builds the Android app (android/) from the current index.html. Download the APK/AAB from the run's "Artifacts".
# If the signing secrets are set (see android/README.md), the release bundle is signed for Google Play.
name: Android app
on:
  push:
    branches: [main]
    paths: ['index.html', 'vendor/**', 'icons/**', 'android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'vendor/**', 'icons/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform 36
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - name: Decode the upload key
        env: { KEYSTORE_BASE64: '${{ secrets.RESUS_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "RESUS_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: building an unsigned release bundle and a debug APK only."
          fi
      - name: Build
        working-directory: android
        env:
          RESUS_KEYSTORE_PASSWORD: ${{ secrets.RESUS_KEYSTORE_PASSWORD }}
          RESUS_KEY_ALIAS: ${{ secrets.RESUS_KEY_ALIAS }}
          RESUS_KEY_PASSWORD: ${{ secrets.RESUS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: resus-assist-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
